name: Simple Release

# ADR-060 单维护者简化发布链：打 tag 即发布。
# 前置：对应提交的 Quality Gate 必须全绿（构建不重复跑测试）。
# 产物：releases/<version>/{SHA256SUMS,SHA256SUMS.sig,server/*.jar,web/**} + LATEST.txt
# 服务器端由 deploy/simple/uten-imp-updater.sh 拉取验签安装。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 vYYYY.MM.DD-N（必须已通过 Quality Gate 的提交上手动触发）"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: simple-release
  cancel-in-progress: false

env:
  # vars（非敏感）：OSS_BUCKET、OSS_ENDPOINT（如 oss-cn-shenzhen.aliyuncs.com）
  # secrets（敏感）：OSS_ACCESS_KEY_ID、OSS_ACCESS_KEY_SECRET、RELEASE_SIGNING_KEY
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  release:
    name: Build, sign, publish to OSS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{1,3}$ ]] \
            || { echo "::error::版本号必须是 vYYYY.MM.DD-N，收到 $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "发布版本：$VERSION（commit $GITHUB_SHA）"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build server double JAR (tests ran in Quality Gate)
        working-directory: server
        run: mvn $MAVEN_ARGS clean package -DskipTests

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Build Flutter Web
        run: |
          flutter pub get
          flutter build web --release --no-pub --no-web-resources-cdn --dart-define=API_BASE_URL=/api

      - name: Assemble release directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(ls server/target/uten-imp-server-*.jar | wc -l)" = 1
          test -f server/target/uten-imp-migrator.jar
          rm -rf dist && mkdir -p dist/server dist/web
          cp server/target/uten-imp-server-*.jar dist/server/uten-imp-server.jar
          cp server/target/uten-imp-migrator.jar dist/server/uten-imp-migrator.jar
          cp -r build/web/. dist/web/
          printf '{"version":"%s","commit":"%s","publishedAt":"%s"}\n' \
            "$VERSION" "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/web/version.json
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"; cat SHA256SUMS

      - name: Sign SHA256SUMS (Ed25519)
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$(mktemp /tmp/release-key.XXXXXX)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          ssh-keygen -y -f "$keyfile" > /tmp/release-key.pub
          echo "签名公钥指纹：$(ssh-keygen -lf /tmp/release-key.pub)"
          cd dist
          ssh-keygen -Y sign -f "$keyfile" -n uten-imp-release SHA256SUMS
          test -f SHA256SUMS.sig
          ssh-keygen -Y verify -f <(echo "uten-imp-release $(cat /tmp/release-key.pub)") \
            -I uten-imp-release -n uten-imp-release -s SHA256SUMS.sig < SHA256SUMS

      - name: Publish to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet oss2==2.19.1
          python3 - "$VERSION" <<'PY'
          import os, sys
          import oss2

          version = sys.argv[1]
          bucket_name = os.environ["OSS_BUCKET"]
          endpoint = os.environ["OSS_ENDPOINT"]
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"],
                           os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name)

          prefix = f"releases/{version}"
          files = []
          for root, _dirs, names in os.walk("dist"):
              for name in names:
                  path = os.path.join(root, name)
                  key = prefix + path.removeprefix("dist")
                  files.append((path, key))

          def md5(b): import hashlib; return hashlib.md5(b).hexdigest()
          import hashlib
          for path, key in files:
              data = open(path, "rb").read()
              bucket.put_object(key, data)
              got = bucket.get_object(key).read()
              if hashlib.md5(got).hexdigest() != hashlib.md5(data).hexdigest():
                  raise SystemExit(f"readback mismatch: {key}")
              print(f"put+readback ok: {key} ({len(data)} bytes)")

          bucket.put_object("LATEST.txt", (version + "\n").encode())
          got = bucket.get_object("LATEST.txt").read().decode().strip()
          if got != version:
              raise SystemExit(f"LATEST readback mismatch: {got!r}")
          print(f"LATEST.txt -> {version}；共 {len(files)} 个对象")
          PY
          rm -rf dist

      - name: Summary
        shell: bash
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          {
            echo "## 发布完成：$VERSION"
            echo "- OSS：$OSS_BUCKET@$OSS_ENDPOINT"
            echo "- 服务器 5 分钟内自动检测；纯代码版本自动激活，含迁移的版本需手动 activate"
          } >> "$GITHUB_STEP_SUMMARY"
