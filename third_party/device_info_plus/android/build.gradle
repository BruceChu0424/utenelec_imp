group 'dev.fluttercommunity.plus.device_info'
version '1.0-SNAPSHOT'

// Flutter 3.44 owns the Kotlin compatibility plugin and its version.
// Newer hosts can supply AGP built-in Kotlin through the same compiler DSL.
apply plugin: 'com.android.library'

android {
    compileSdk 34
    namespace 'dev.fluttercommunity.plus.device_info'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        minSdk 19
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage', 'MissingPermission'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
