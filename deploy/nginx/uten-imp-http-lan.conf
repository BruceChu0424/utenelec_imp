# Uten IMP 内网站点（内部 CA + 自签 TLS）。
# 前端登录需要 WebCrypto，浏览器安全上下文要求必须 HTTPS：
# 首装时按 RUNBOOK 生成内部根 CA 与叶子证书（SAN 含内网域名与服务器 IP），
# 员工电脑运行 deploy/simple/erp-trust-init.bat 导入根 CA 后即为受信任绿锁。
# 证书路径与 6.x 指引一致：/etc/ssl/certs/uten-imp-lan.crt + /etc/ssl/private/uten-imp-lan.key
# SOURCE TEMPLATE ONLY: render the approved DNS name and exact office CIDR;
# never commit a live hostname or private-network address to this file.

limit_req_zone $binary_remote_addr zone=uten_health_ip:10m rate=1000r/s;
# 登录类按 IP 分三档 (2026-10-06, ADR-157)。局域网里每台电脑一个 IP; 车间共用电脑一分钟
# 30 次登录、瞬时 10 次足够, 撞库则很快被 429 挡住。按账号锁定仍由后端负责 (连续 5 次锁 15 分钟)。
limit_req_zone $binary_remote_addr zone=uten_login_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=uten_sms_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=uten_auth_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=uten_api_ip:20m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=uten_goods_import_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=uten_goods_import_conn:10m;
limit_req_zone $binary_remote_addr zone=uten_ai_jobs_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=uten_ai_jobs_conn:10m;

# 文件名带内容指纹(8 位以上十六进制)的静态资源: 内容变了名字就变, 可一年不回源(ADR-108)。
# /api/ 与 /actuator/ 排除在外: 接口响应永远不能被长缓存。
# 用 map 在 server 级统一加头(location 里写 add_header 会丢掉 server 级安全头);
# 其余路径取空值, nginx 不发该头。入口文件(index.html / flutter_bootstrap.js /
# version.json)不带指纹, 照旧每次回源校验。
map $uri $uten_fingerprinted_cache_control {
    default "";
    "~*^/(?!api/|actuator/).*\.[0-9a-f]{8,}\.(?:js|mjs|wasm|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf)$" "public, max-age=31536000, immutable";
}

upstream uten_imp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 回环静态入口探针（entry-watchdog 使用）
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/uten-imp/current/web;
    access_log off;
    log_not_found off;

    location = /index.html {
        try_files $uri =503;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    location / {
        return 404;
    }
}

# 80 端口: 根 CA 下载 (安装信任前需可匿名获取) + 其余一律跳到 HTTPS。
# 跳转目标写死内网域名, 不照抄客户端发来的 Host 头 (2026-10-06): 员工电脑须能解析该域名。
server {
    listen 80;
    server_name __INTERNAL_DOMAIN__ _;
    server_tokens off;

    allow 127.0.0.1;
    allow ::1;
    allow __EXACT_OFFICE_CIDR__;
    deny all;

    location = /ca/uten-imp-root-ca.crt {
        alias /opt/uten-imp/web-extra/uten-imp-root-ca.crt;
    }

    location / {
        return 308 https://__INTERNAL_DOMAIN__$request_uri;
    }
}

server {
    # HTTP/2: 页面首屏的多个并行 API 请求复用一条连接, 不再受浏览器每域 6 连接上限排队。
    listen 443 ssl http2;
    server_name __INTERNAL_DOMAIN__ _;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate /etc/ssl/certs/uten-imp-lan.crt;
    ssl_certificate_key /etc/ssl/private/uten-imp-lan.key;
    # 只允许 TLS1.2/1.3; TLS1.2 只留前向保密的 AEAD 套件 (叶子私钥将来泄露也解不开以前抓的包)。
    # 服务器 /etc/nginx/nginx.conf 的 http 级 ssl_protocols 同步改成 TLSv1.2 TLSv1.3。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:UTEN_SSL:10m;
    ssl_session_timeout 1d;

    allow 127.0.0.1;
    allow ::1;
    allow __EXACT_OFFICE_CIDR__;
    deny all;

    root /opt/uten-imp/current/web;
    index index.html;
    client_max_body_size 2m;

    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 45s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # HSTS 先用 300 秒观察一周 (员工电脑都已装内部根证书、没有人被挡在外面), 再改成 31536000。
    # 安全头都在 server 级统一加; location 里不要再写 add_header, 否则这些头会整组丢失。
    add_header Strict-Transport-Security "max-age=300" always;
    # style-src 需 'unsafe-inline'：Flutter Web 运行时注入内联样式
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $uten_fingerprinted_cache_control always;

    location = /actuator/health {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location ~ ^/actuator/health/(?:liveness|readiness)$ {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location /actuator/ {
        return 404;
    }

    # 员工与访客登录: 每 IP 每分钟 30 次, 瞬时 10 次
    location ~ ^/api/(?:visitor/)?auth/login$ {
        limit_req zone=uten_login_ip burst=10 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 访客发验证码 (会真的发短信/消息): 每 IP 每分钟 6 次, 瞬时 3 次
    location = /api/visitor/auth/send-code {
        limit_req zone=uten_sms_ip burst=3 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 续期与退出: 页面并发请求会同时续期, 每 IP 每秒 10 次、瞬时 50 次
    location ~ ^/api/(?:visitor/)?auth/(?:refresh|logout)$ {
        limit_req zone=uten_auth_ip burst=50 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Local invoice OCR: allow one 8 MiB image plus multipart overhead. Keep the
    # larger body/timeout local to this endpoint; Spring still authorizes and caps it.
    location = /api/expense-claims/invoices/recognize {
        client_max_body_size 9m;
        limit_req zone=uten_api_ip burst=100 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # AI recognition jobs (ADR-133): raw octet-stream customer files. Keep this
    # 16 MiB exception exact and streamed; the application enforces per-user
    # limits, a bounded reader and returns 202 immediately (work runs in the
    # background, the client polls GET /api/ai/jobs/{id} through /api/).
    location = /api/ai/jobs {
        client_max_body_size 16m;
        limit_req zone=uten_ai_jobs_ip burst=4 nodelay;
        limit_conn uten_ai_jobs_conn 2;
        limit_conn_status 429;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Goods workbooks use raw octet-stream uploads. Keep the 10 MiB exception
    # exact, streamed and isolated from ordinary JSON endpoints.
    location ~ ^/api/master/goods/import/(?:detect|commit)$ {
        client_max_body_size 10m;
        limit_req zone=uten_goods_import_ip burst=4 nodelay;
        limit_conn uten_goods_import_conn 2;
        limit_conn_status 429;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ~ ^/api/attachments/raw/[A-Za-z0-9._-]+$ {
        client_max_body_size 25m;
        limit_req zone=uten_api_ip burst=100 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api/.*/export$ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    # 清空业务数据(超管专属测试端点，ADR-067 §7)是同步长请求：受理后 5 分钟内完成文件阶段
    # (检查 ≤60s + 排水 ≤45s + 加锁删除测试文件，共用一个截止点，ADR-155) + 清库(至少 5 分钟)。
    # 精确匹配优先于下方 /api/ 前缀与正则 location，仅此路径放宽到 600s
    # （前端 ApiClient.postLongRunning 对该端点的接收超时为 10 分钟，与之对齐）。
    location = /api/system-test/business-data/reset {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /ca/uten-imp-root-ca.crt {
        alias /opt/uten-imp/web-extra/uten-imp-root-ca.crt;
    }

    location ^~ /fallback_fonts/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    # 带内容指纹的静态资源: 长缓存头由上面的 map 统一给; 缺文件直接 404, 不回落到 index.html。
    location ~* "^/(?!api/|actuator/).*\.[0-9a-f]{8,}\.(?:js|mjs|wasm|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf)$" {
        try_files $uri =404;
        access_log off;
    }

    # 入口与未带指纹的资源(index.html / flutter_bootstrap.js / main.dart.js 等)每次回源校验
    # (no-cache + ETag, 没变只回 304), 发版后已打开的标签页下次加载即取新版。
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
