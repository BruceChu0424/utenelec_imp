name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compare_reference:
        description: Run an additional unfiltered serial reference and compare every test instance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action 对组织仓库强制收费 license；改用固定版本 gitleaks CLI
      # （同一检测引擎，同样读取 .gitleaksignore / gitleaks.toml），无 license 依赖。
      - name: Install pinned gitleaks 8.29.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --no-banner --verbose

  # The fast lane remains an early signal. The full gate below requires every
  # discovered Surefire and Failsafe test across isolated, duration-balanced jobs.
  backend-fast:
    name: "Backend / Java 21 (fast: unit + architecture)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify reproducible complete PDF font profile
        run: python3 scripts/build_pdf_font_profile.py --check
      - name: Unit, architecture, and contract tests (DB-gated tests skip by design)
        working-directory: server
        # Exercise build-directory independence in the early lane too.
        run: mvn --batch-mode --no-transfer-progress -Duten.build.directory=target-fast verify

  backend-plan:
    name: Backend / discover complete test inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify test partitioning and report reconciliation
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_backend_test_shards.py' -v
          python3 -m unittest discover -s .github/scripts -p 'test_safe_artifact_extract.py' -v
      - name: Discover all tests and balance four complete partitions
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py plan --output server/target-ci-plan --shards 4 --history .github/test-timings/backend.json
      - name: Preserve exact test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-plan
          path: server/target-ci-plan/
          if-no-files-found: error
          retention-days: 14

  backend-shards:
    name: Backend / DB partition ${{ matrix.shard }}
    needs: backend-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # Collect all failures in one run; no partition is allowed to fail silently.
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prepare raw plan staging
        run: mkdir -m 0700 -- "$RUNNER_TEMP/quality-raw-plan"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-test-plan
          path: ${{ runner.temp }}/quality-raw-plan
          skip-decompress: true
          digest-mismatch: error
      - name: Safely unpack authenticated test plan
        run: python3 .github/scripts/safe_artifact_extract.py --raw "$RUNNER_TEMP/quality-raw-plan" --artifact backend-test-plan
      - name: Run complete assigned partition with isolated PostgreSQL
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py run --plan server/target-ci-plan/plan.json --shard ${{ matrix.shard }} --output server/target-ci-reports
      - name: Preserve test results and timings even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: |
            server/target-ci-reports/
            !server/target-ci-reports/**/tmp/**
          if-no-files-found: error
          retention-days: 14

  backend-reference:
    name: Backend / optional unfiltered reference
    needs: backend-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUN_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_reference }}
    steps:
      # A successful no-op job in ordinary runs preserves the release gate's
      # pending-job contract; the complete sharded suite is always mandatory.
      - name: Ordinary run uses the complete parallel suite
        if: env.RUN_REFERENCE != 'true'
        run: echo 'Additional serial comparison was not requested; all full-suite partitions remain required.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_REFERENCE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: env.RUN_REFERENCE == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Prepare raw reference-plan staging
        if: env.RUN_REFERENCE == 'true'
        run: mkdir -m 0700 -- "$RUNNER_TEMP/quality-raw-plan"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.RUN_REFERENCE == 'true'
        with:
          name: backend-test-plan
          path: ${{ runner.temp }}/quality-raw-plan
          skip-decompress: true
          digest-mismatch: error
      - name: Safely unpack authenticated reference plan
        if: env.RUN_REFERENCE == 'true'
        run: python3 .github/scripts/safe_artifact_extract.py --raw "$RUNNER_TEMP/quality-raw-plan" --artifact backend-test-plan
      - name: Original unfiltered serial Maven verify on the same Linux environment
        if: env.RUN_REFERENCE == 'true'
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py baseline --plan server/target-ci-plan/plan.json --output server/target-ci-reference
      - name: Preserve unfiltered reference even after failure
        if: always() && env.RUN_REFERENCE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-unfiltered-reference
          path: |
            server/target-ci-reference/
            !server/target-ci-reference/**/tmp/**
          if-no-files-found: error
          retention-days: 14

  backend-db:
    # Preserve the existing required-check name. Success means all four complete
    # partitions passed AND their actual reports reconcile with the discovered plan.
    name: "Backend / Java 21 (full: DB full-chain)"
    needs: [backend-plan, backend-shards, backend-reference]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare raw summary-plan staging
        run: mkdir -m 0700 -- "$RUNNER_TEMP/quality-raw-plan"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-test-plan
          path: ${{ runner.temp }}/quality-raw-plan
          skip-decompress: true
          digest-mismatch: error
      - name: Safely unpack authenticated summary plan
        run: python3 .github/scripts/safe_artifact_extract.py --raw "$RUNNER_TEMP/quality-raw-plan" --artifact backend-test-plan
      - name: Prepare raw partition-report staging
        run: mkdir -m 0700 -- "$RUNNER_TEMP/quality-raw-reports"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: backend-test-results-*
          path: ${{ runner.temp }}/quality-raw-reports
          merge-multiple: false
          skip-decompress: true
          digest-mismatch: error
      - name: Safely merge authenticated partition reports
        run: python3 .github/scripts/safe_artifact_extract.py --raw "$RUNNER_TEMP/quality-raw-reports" --artifact 'backend-test-results-*'
      - name: Prepare raw unfiltered-reference staging
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        run: mkdir -m 0700 -- "$RUNNER_TEMP/quality-raw-reference"
      - name: Collect unfiltered reference after all producers finish
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-unfiltered-reference
          path: ${{ runner.temp }}/quality-raw-reference
          skip-decompress: true
          digest-mismatch: error
      - name: Safely unpack authenticated unfiltered reference
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        run: python3 .github/scripts/safe_artifact_extract.py --raw "$RUNNER_TEMP/quality-raw-reference" --artifact backend-unfiltered-reference
      - name: Require successful jobs and reconcile complete test coverage
        env:
          PLAN_RESULT: ${{ needs.backend-plan.result }}
          PARTITION_RESULT: ${{ needs.backend-shards.result }}
          REFERENCE_RESULT: ${{ needs.backend-reference.result }}
          COMPARE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_reference }}
        run: |
          python3 .github/scripts/backend_test_shards.py verify --plan server/target-ci-plan/plan.json --reports server/target-ci-reports
          if [ "$COMPARE_REFERENCE" = true ]; then
            python3 .github/scripts/backend_test_shards.py compare --plan server/target-ci-plan/plan.json --reports server/target-ci-reports --reference server/target-ci-reference
          fi
          test "$PLAN_RESULT" = success
          test "$PARTITION_RESULT" = success
          test "$REFERENCE_RESULT" = success
      - name: Preserve complete-suite reconciliation and future scheduling hints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-summary
          path: |
            server/target-ci-reports/verification.json
            server/target-ci-reports/timings.json
            server/target-ci-reports/comparison.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Flutter / Web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Verify locked Flutter build and security-scan contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_gate.py' -v
      - run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Verify browser update and stale-bundle behavior before release
        run: node --test web/update_check.test.cjs
      - name: Verify browser draft reset, receipts, and exact material quantities
        run: >-
          flutter test --no-pub --platform chrome
          test/shared/drafts/form_draft_storage_browser_test.dart
          test/shared/drafts/form_draft_history_browser_test.dart
          test/device_audit_receipt_storage_web_test.dart
          test/features/production/models/material_quantity_apportionment_test.dart
      - name: Verify version-pinned local font assets
        shell: pwsh
        run: ./.github/scripts/verify-font-assets.ps1
      - name: Build production web bundle
        run: flutter build web --release --no-pub --no-web-resources-cdn --no-wasm-dry-run --dart-define=API_BASE_URL=/api
      - name: Verify release stamping of the actual Flutter bundle
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from argparse import Namespace
          from pathlib import Path
          from deploy.release import release_tools

          pubspec = Path("pubspec.yaml")
          source = release_tools.read_flutter_web_source(pubspec)
          web = Path(os.environ["RUNNER_TEMP"]) / "quality-stamped-web"
          shutil.copytree("build/web", web)
          release_tools.stamp_web_release(Namespace(
              pubspec=pubspec, web_root=web, version=source.release_version,
              commit=os.environ["GITHUB_SHA"],
          ))
          print(f"Verified actual Flutter metadata and {source.release_version} release stamping")
          PY

  native-windows:
    name: Flutter / Windows native update contracts
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - name: Verify package identity and real updater success, rejection, and rollback
        shell: pwsh
        run: |
          python -m unittest discover -s deploy/client -p 'test*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File deploy/client/test_windows_updater.ps1 -Python (Get-Command python).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter pub get --enforce-lockfile
      - name: Compile Windows application and native update channel
        run: flutter build windows --release --no-pub

  native-android:
    name: Flutter / Android native update compile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Android overlay policy and vendored runtime provenance
        run: python3 -m unittest discover -s .github/scripts -p test_android_build_contract.py -v
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Compile Kotlin, the FileProvider manifest, and Dart with the local debug
      # identity. This job never receives release signing material or publishes.
      - name: Compile Android application and native package installer bridge
        run: flutter build apk --debug --no-pub --target-platform android-arm64

  website:
    name: Website / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Locked install, lint, typecheck, behavior, migrations, audit and isolated build
        working-directory: website
        run: node scripts/quality-gate.mjs
      - name: Website deployment contracts
        working-directory: website
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'

  deployment:
    name: Deployment contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test updater, backup, setup, monitoring, and cloud policy helpers
        run: |
          python3 -m unittest discover -s deploy/updater -p "test*.py" -v
          python3 -m unittest discover -s deploy/release -p "test_material_forecast_payload.py" -v
          # The host daemon runs as root and must inspect every process fd.
          # Exercise its authority fixtures without weakening fail-closed cleanup.
          sudo /usr/bin/python3 -m unittest discover -s deploy/simple -p "test*.py" -v
          python3 -m unittest discover -s deploy/postgres/backup -p "test*.py" -v
          python3 -m unittest discover -s deploy/setup -p "test*.py" -v
          python3 -m unittest discover -s deploy/monitoring -p "test*.py" -v
          python3 -m unittest discover -s deploy/aliyun-oidc -p "test*.py" -v
          python3 -m unittest discover -s deploy/remote-access -p "test*.py" -v
          python3 -m unittest discover -s deploy/client -p "test*.py" -v
      - name: Verify complete disaster recovery and backup contracts in isolated Linux
        shell: bash
        run: |
          set -euo pipefail
          docker build -t uten-dr-contract:ci -f deploy/disaster-recovery/tests/Dockerfile deploy/disaster-recovery
          # Record the default LSM/mount decision before the required fixture.
          # SYS_ADMIN alone does not override Docker's host AppArmor profile.
          docker run --rm --network none --cap-add SYS_ADMIN \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            uten-dr-contract:ci python deploy/disaster-recovery/tests/run_contracts.py --probe-mount
          docker run --rm --network none --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            uten-dr-contract:ci
      - name: Verify remote TLS and compromised-cloud isolation in disposable containers
        shell: bash
        run: |
          set -euo pipefail
          docker build -t uten-remote-contract:ci -f deploy/remote-access/tests/Dockerfile deploy/remote-access
          docker run --rm --network none --cap-add NET_ADMIN \
            --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/remote-access,target=/src,readonly" \
            uten-remote-contract:ci python3 tests/integration_linux.py --firewall
          docker run --rm --network none --cap-add NET_ADMIN --cap-add SYS_ADMIN \
            --sysctl net.ipv4.ip_forward=1 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/deploy/remote-access,target=/src,readonly" \
            uten-remote-contract:ci python3 tests/network_isolation_linux.py
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            uten-remote-contract:ci python3 /workspace/deploy/client/nginx_client_updates_integration.py
      - name: Test OCR transport and image limits without downloading models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ocr-tests"
          "$RUNNER_TEMP/ocr-tests/bin/pip" install --quiet -r deploy/ocr/requirements-test.txt
          "$RUNNER_TEMP/ocr-tests/bin/python" -m pip check
          "$RUNNER_TEMP/ocr-tests/bin/python" -m unittest discover -s deploy/ocr -p 'test_*.py' -v
      - name: Validate deployment templates and script syntax
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File deploy/verify-templates.ps1
          mapfile -d '' shell_scripts < <(
            find deploy website/deploy -type f -name '*.sh' -print0 | sort -z
          )
          test "${#shell_scripts[@]}" -gt 0
          for script in "${shell_scripts[@]}"; do
            bash -n "$script"
          done
          python3 -m unittest discover \
            -s deploy/setup \
            -p "test_prepare_existing_test_host_internal_runtime.py" \
            -k SystemdProspectiveContractTest \
            -v
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(
              path
              for root in (Path("deploy"), Path("website/deploy"))
              for path in root.rglob("*.py")
          )
          if not paths:
              raise SystemExit("no deployment Python files found")
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"validated {len(paths)} deployment Python files")
          PY
