# Uten IMP 内网 HTTP 站点（过渡期：未部署内部 CA 证书前使用）。
# 与 deploy/nginx/uten-imp.conf.example 同源的限流/代理/安全头边界，仅去掉 TLS。
# 启用 HTTPS 后应切回正式模板（80 端口 308 跳转 + 443 server + HSTS）。
# SOURCE TEMPLATE ONLY: render the approved DNS name and exact office CIDR;
# never commit a live hostname or private-network address to this file.

limit_req_zone $binary_remote_addr zone=uten_health_ip:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=uten_auth_ip:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=uten_api_ip:20m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=uten_goods_import_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=uten_goods_import_conn:10m;

upstream uten_imp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 回环静态入口探针（entry-watchdog 使用）
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/uten-imp/current/web;
    access_log off;
    log_not_found off;

    location = /index.html {
        try_files $uri =503;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name __INTERNAL_DOMAIN__ _;
    server_tokens off;
    limit_req_status 429;

    allow 127.0.0.1;
    allow ::1;
    allow __EXACT_OFFICE_CIDR__;
    deny all;

    root /opt/uten-imp/current/web;
    index index.html;
    client_max_body_size 2m;

    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 45s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /actuator/health {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location ~ ^/actuator/health/(?:liveness|readiness)$ {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location /actuator/ {
        return 404;
    }

    location ~ ^/api/(?:auth/(?:login|refresh|logout)|visitor/auth/(?:send-code|login|refresh|logout))$ {
        limit_req zone=uten_auth_ip burst=2000 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Goods workbooks use raw octet-stream uploads. Keep the 10 MiB exception
    # exact, streamed and isolated from ordinary JSON endpoints.
    location ~ ^/api/master/goods/import/(?:detect|commit)$ {
        client_max_body_size 10m;
        limit_req zone=uten_goods_import_ip burst=4 nodelay;
        limit_conn uten_goods_import_conn 2;
        limit_conn_status 429;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ~ ^/api/attachments/raw/[A-Za-z0-9._-]+$ {
        client_max_body_size 25m;
        limit_req zone=uten_api_ip burst=100 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api/.*/export$ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location ^~ /fallback_fonts/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
