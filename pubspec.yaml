name: uten_imp
description: "优腾综合管理平台 - Uten Integrated Management Platform"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # GlobalCupertinoLocalizations and Cupertino widgets require this font asset.
  cupertino_icons: ^1.0.9

  # 路由
  go_router: ^14.6.2

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 国际化
  intl: ^0.20.2

  # 时间抽象（表格手动双击检测用；测试环境为 fake clock 随 pump 推进）
  clock: ^1.1.2

  # 存储（偏好持久化）
  shared_preferences: ^2.3.3

  # 敏感存储（令牌：iOS Keychain / Android Keystore）
  flutter_secure_storage: ^9.2.2

  # 设备检测（性能分级用）
  device_info_plus: ^11.2.0

  # 网络
  dio: ^5.7.0

  # 打开政策与监管的政府官方网站原文
  url_launcher: ^6.3.2

  # 文件保存（导出加密 Excel：桌面/移动写下载/文档目录；Web 走浏览器 blob 不依赖此包）
  path_provider: ^2.1.5

  # 文件/图片选择（报销附件上传：发票照片/PDF 等）
  file_picker: ^8.1.7

  # A4 预览与打印（货品配件清单等打印件：pdf 生成 + printing 系统打印对话框）
  pdf: ^3.11.3
  printing: ^5.14.2

  # 扫码 / 二维码（访客系统：保安扫码 + 访客凭证）
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  # 工具
  crypto: ^3.0.7
  uuid: ^4.5.1
  collection: ^1.18.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/celebration/
    # 完整字体仅在打印/导出时按需加载；Web 界面使用下方 UI 子集，并将
    # Flutter 的中文回退分片改为同源懒加载，兼顾严格 CSP 与首屏体积。
    - assets/fonts/NotoSansSCFull.ttf

  # 中文字体本地化：UI 子集覆盖现有业务数据中的常用中文；缺字由
  # web/fallback_fonts 下与 Flutter 3.44.2 对齐的同源分片按需补齐。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    # CanvasKit otherwise fetches its mandatory default "Roboto" fallback
    # from fonts.gstatic.com. Alias the bundled CJK/ASCII font so strict CSP
    # and offline deployments remain fully same-origin.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400

# 应用启动图标（手机/桌面 launcher icon + Web favicon）= logo_ip.png。
# 生成命令：dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/images/logo_ip.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_version: 21
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#039855"
