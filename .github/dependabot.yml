version: 2

updates:
  # Upgrade candidates are tested in material-forecast.yml before release.
  # A version change also requires the reviewed complete runtime closure and both
  # platform hash locks to be regenerated with build_payload.py --refresh-lock.
  # The exact wheel locks deliberately fail closed until that candidate is reviewed.
  - package-ecosystem: "pip"
    directory: "/services/material_forecast"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3

  - package-ecosystem: "pub"
    directory: "/"
    # These packages move with the pinned Flutter SDK, not independent pub releases.
    # Skip their SDK source metadata before Dependabot treats it as hosted metadata.
    ignore:
      - dependency-name: "flutter"
      - dependency-name: "flutter_localizations"
      - dependency-name: "flutter_test"
      - dependency-name: "integration_test"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5

  - package-ecosystem: "maven"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
