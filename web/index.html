<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <!-- CI replaces this token exactly once and emits the signed version.json. -->
  <meta name="uten-release-version" content="__UTEN_RELEASE_VERSION__">
  <meta name="description" content="优腾综合管理平台 - Uten Integrated Management Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="优腾·综合管理平台">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>优腾·综合管理平台</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="loading.css">
  <link rel="stylesheet" href="update_check.css">
</head>
<body>
  <!-- 启动加载动画（Flutter 接管后移除） -->
  <div id="loading">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script src="loading.js" defer></script>
  <script src="update_check.js" defer></script>

  <!--

  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
