# 开机时数据库等本机备份卷先挂好再启动 (ADR-157)。安装为
# /etc/systemd/system/postgresql@16-main.service.d/20-uten-backup-order.conf (root 0644), daemon-reload。
# 只排顺序不加依赖: 备份卷挂不上时数据库照常启动, 只是 WAL 推往 repo2 会报错 (见 RUNBOOK「repo2 不可用」)。
# 不加这条时, 数据库可能比 /srv/uten-backup 早几秒起来, 开机后第一段 WAL 推 repo2 失败一次再自愈,
# 状态页恰好在这几秒采样就会误报一次归档失败。
[Unit]
After=srv-uten-backup.mount
