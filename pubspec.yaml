name: uten_imp
description: "优腾综合管理平台 - Uten Integrated Management Platform"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 路由
  go_router: ^14.6.2

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 国际化
  intl: ^0.20.2

  # 存储（偏好持久化）
  shared_preferences: ^2.3.3

  # 敏感存储（令牌：iOS Keychain / Android Keystore）
  flutter_secure_storage: ^9.2.2

  # 设备检测（性能分级用）
  device_info_plus: ^11.2.0

  # 网络
  dio: ^5.7.0

  # 文件保存（导出加密 Excel：桌面/移动写下载/文档目录；Web 走浏览器 blob 不依赖此包）
  path_provider: ^2.1.5

  # 扫码 / 二维码（访客系统：保安扫码 + 访客凭证）
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  # 工具
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # 中文字体本地化：CanvasKit 渲染中文需要 CJK 字体数据，默认从 fonts.gstatic.com 拉
  # Noto Sans SC（中国网络失败）。本地打包后用本地，不依赖 CDN。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
