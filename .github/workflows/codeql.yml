name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: read

jobs:
  java:
    name: Java security and quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Full-project queries avoid the compare API's 300-file diff limit.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
      # Retain baseline file coverage on PRs as well as push/scheduled analyses.
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify zero-finding SARIF gate contract
        run: python3 -m unittest discover -s .github/scripts -p 'test_codeql_sarif_gate.py' -v

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          # Keep the existing pinned Action's CLI/query bundle for comparable findings.
          tools: linked
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Compile backend for CodeQL
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        id: analyze
        with:
          upload: never
          upload-database: false

      - name: Require zero CodeQL findings
        run: python3 .github/scripts/check_codeql_sarif.py "${{ steps.analyze.outputs.sarif-output }}"

      - name: Preserve CodeQL SARIF artifact
        if: ${{ always() && steps.analyze.outputs.sarif-output != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-java-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 14
