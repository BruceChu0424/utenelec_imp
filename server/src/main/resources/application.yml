spring:
  application:
    name: uten-imp-server
  profiles:
    active: ${UTEN_PROFILE:dev}
  datasource:
    url: ${UTEN_DB_URL:jdbc:postgresql://localhost:5432/uten_imp}
    username: ${UTEN_DB_USER:uten}
    password: ${UTEN_DB_PASSWORD:uten}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate          # schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-durations-as-timestamps: false
      fail-on-empty-beans: false

server:
  port: 8080
  forward-headers-strategy: framework

uten:
  jwt:
    # 必填：HS256 密钥（≥32 字节）。走 server/.env 的 UTEN_JWT_SECRET 或环境变量；缺省 fail-fast。
    secret: ${UTEN_JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    issuer: uten-imp
  security:
    cors-allowed-origins: ${UTEN_CORS_ORIGINS:http://localhost:53764,http://localhost:8080}
    login-rate-limit-per-minute: 5
    lockout-threshold: 5
    lockout-minutes: 15
    password-history-size: 5
    # swagger 白名单开关：dev 默认放行；prod 在 application-prod.yml 关闭（同时 springdoc 整体禁用）
    swagger-enabled: ${UTEN_SWAGGER_ENABLED:true}
  crypto:
    # 必填：pgcrypto 主密钥（PII 加密）。走 server/.env 或环境变量；缺省 fail-fast。生产放 Vault/KMS。
    pgp-master-key: ${UTEN_PGP_MASTER_KEY}
    # 密钥版本（密文前缀 v<version>:，便于轮换）；旧密钥放 pgp-legacy-keys 解历史密文。
    pgp-key-version: ${UTEN_PGP_KEY_VERSION:1}
    # 必填：HMAC 密钥（身份证号查重）。走 server/.env 或环境变量；缺省 fail-fast。
    hmac-key: ${UTEN_HMAC_KEY}
  bootstrap:
    admin-login: admin
    # 必填：引导超管一次性密码。走 server/.env 或环境变量；首登强制改。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}
  sms:
    # 网关：log（开发期打印日志，验证码见后端日志；不真实发送）/ aliyun（阿里云，需配 AK/SK/签名/模板）
    provider: ${UTEN_SMS_PROVIDER:log}
    access-key-id: ${UTEN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${UTEN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${UTEN_SMS_SIGN_NAME:}
    template-code: ${UTEN_SMS_TEMPLATE_CODE:}
    code-ttl-minutes: 5
    send-interval-seconds: 60
    daily-limit: 10

app:
  legacy:
    # 老库（SQL Server YTDQ_2023）迁移数据源；默认关，迁移时显式 UTEN_LEGACY_ENABLED=true
    enabled: ${UTEN_LEGACY_ENABLED:false}
    datasource-url: ${UTEN_LEGACY_DB_URL:}
    datasource-username: ${UTEN_LEGACY_DB_USER:}
    datasource-password: ${UTEN_LEGACY_DB_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.uten.imp: DEBUG
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
