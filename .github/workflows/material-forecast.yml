name: Material forecast

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: material-forecast-${{ github.sha }}
  cancel-in-progress: false

jobs:
  offline:
    name: Offline model and replay contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the same Python minor as the universal dependency lock. No GPU,
      # production secrets, a market subscription or external data requests.
      - name: Verify inference and security use the complete hashed lock
        run: python3.12 -m unittest discover -s services/material_forecast/tests -p test_ci_contract.py -v
      - name: Verify separate writer and ERP reader filesystem permissions
        run: sudo "$(command -v python3.12)" services/material_forecast/tests/check_linux_publication_permissions.py
      - name: Install pinned inference dependencies
        run: |
          python3.12 -m venv .venv-material-forecast
          .venv-material-forecast/bin/python -m pip install --require-hashes --only-binary=:all: --disable-pip-version-check -r services/material_forecast/requirements.txt
          .venv-material-forecast/bin/python -m pip check
      - name: Verify point-in-time replay, model gates and real library inference
        run: .venv-material-forecast/bin/python -m unittest discover -s services/material_forecast/tests -v
      - name: Verify market-state backup and restore contracts
        run: .venv-material-forecast/bin/python -m unittest discover -s deploy/postgres/backup -p 'test_market_state*.py' -v
      - name: Build and prepare the complete offline managed runtime
        run: |
          .venv-material-forecast/bin/python services/material_forecast/build_payload.py --platform linux-x86_64 --output "$RUNNER_TEMP/material-forecast-payload"
          .venv-material-forecast/bin/python "$RUNNER_TEMP/material-forecast-payload/prepare_runtime.py" --payload "$RUNNER_TEMP/material-forecast-payload" --cache "$RUNNER_TEMP/material-forecast-cache"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Verify Java preparation of the offline runtime
        id: java_runtime
        working-directory: server
        env:
          UTEN_RUN_MARKET_PREPARATION_SMOKE: "true"
        run: |
          mvn -B -ntp -Dtest=MaterialForecastRuntimePreparationSmokeTest \
            -Duten.market.test.payload="$RUNNER_TEMP/material-forecast-payload" \
            -Duten.market.test.cache="$RUNNER_TEMP/material-forecast-java-cache" \
            -Duten.market.test.python="$(command -v python3.12)" \
            -Duten.market.test.preparationEvidence="$RUNNER_TEMP/material-forecast-java-evidence.json" test
      - name: Keep Java runtime preparation evidence
        if: ${{ !cancelled() && steps.java_runtime.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: material-forecast-java-preparation
          path: ${{ runner.temp }}/material-forecast-java-evidence.json
          if-no-files-found: error
