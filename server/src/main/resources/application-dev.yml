# 开发环境：宽松、详细日志、不强制 HTTPS
server:
  ssl:
    enabled: false

logging:
  level:
    com.uten.imp: DEBUG
    org.springframework.security: INFO

uten:
  jwt:
    issuer: ${UTEN_JWT_ISSUER:uten-imp-dev}
  security:
    require-https: false
    swagger-enabled: ${UTEN_SWAGGER_ENABLED:true}
  sms:
    provider: ${UTEN_SMS_PROVIDER:log}
    expose-code: ${UTEN_SMS_EXPOSE_CODE:true}

app:
  legacy:
    # 本机 LocalDB（已还原 YTDQ_2023）；迁移时设 UTEN_LEGACY_ENABLED=true
    enabled: ${UTEN_LEGACY_ENABLED:false}
    datasource-url: "${UTEN_LEGACY_DB_URL:jdbc:sqlserver://(localdb)\\MSSQLLocalDB;databaseName=YTDQ_2023;encrypt=false}"
    datasource-username: ${UTEN_LEGACY_DB_USER:}
    datasource-password: ${UTEN_LEGACY_DB_PASSWORD:}
