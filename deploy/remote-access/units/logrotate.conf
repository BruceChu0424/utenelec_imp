/var/log/uten-remote/*.log {
    daily
    maxsize 10M
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    su uten-remote uten-remote
    create 0640 uten-remote uten-remote
    sharedscripts
    postrotate
        /usr/bin/systemctl kill --kill-whom=main --signal=USR1 uten-remote-nginx.service >/dev/null 2>&1 || true
    endscript
}
