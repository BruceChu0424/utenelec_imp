<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="优腾综合管理平台 - Uten Integrated Management Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="优腾·综合管理平台">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>优腾·综合管理平台</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 字体回退：优先系统字体，避免 CanvasKit 去 gstatic.com 拉 Noto Sans SC 失败 */
    html, body {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    /* 加载占位：Flutter 启动前显示一个简单的加载动画 */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .dot {
      width: 10px;
      height: 10px;
      margin: 0 4px;
      border-radius: 50%;
      background: #039855;
      animation: bounce 1.2s infinite ease-in-out;
    }
    #loading .dot:nth-child(2) { animation-delay: 0.15s; }
    #loading .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 启动加载动画（Flutter 接管后移除） -->
  <div id="loading">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script>
    // Flutter 首帧渲染后隐藏加载动画
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.classList.add('done');
        setTimeout(function () { loading.remove(); }, 300);
      }
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
