spring:
  application:
    name: uten-imp-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      # 留存归档可能持续数分钟，独立线程避免阻塞 Outbox、预警和报表刷新。
      pool:
        size: ${UTEN_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: uten-scheduler-
  profiles:
    # Fail closed: an omitted profile starts with production constraints.
    # Local development must explicitly set UTEN_PROFILE=dev.
    active: ${UTEN_PROFILE:prod}
  datasource:
    url: ${UTEN_DB_URL:jdbc:postgresql://localhost:5432/uten_imp}
    username: ${UTEN_DB_USER:uten}
    password: ${UTEN_DB_PASSWORD:uten}
    hikari:
      pool-name: uten-imp
      maximum-pool-size: ${UTEN_DB_POOL_MAX:20}
      minimum-idle: ${UTEN_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${UTEN_DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${UTEN_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${UTEN_DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate          # schema 由 Flyway 管理
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: ${UTEN_FLYWAY_BASELINE_ON_MIGRATE:false}
    clean-disabled: true
    validate-migration-naming: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      write-durations-as-timestamps: false
      fail-on-empty-beans: false

server:
  port: 8080
  shutdown: graceful
  # Finite combined request-line/header budget. Keep the reverse proxy aligned;
  # reduce JWT/device evidence size before considering any further increase.
  max-http-request-header-size: ${UTEN_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
  # 默认不信任任何 Forwarded/X-Forwarded-* 请求头，避免后端端口被直接访问时伪造客户端 IP。
  # 生产环境仅在 application-prod.yml 中对明确的内网/回环代理启用 Tomcat RemoteIpValve。
  forward-headers-strategy: none

uten:
  finance:
    asset:
      # Fail closed until recognition/disposal/termination have dedicated maker-checker reversal workflows.
      posted-workflows-enabled: ${UTEN_FINANCE_ASSET_POSTED_WORKFLOWS_ENABLED:false}
  features:
    # 货品归属可见性（外贸按人隔离）。2026-07-31 起默认关闭：全员可见全部货品；
    # 代码保留，置 true（或环境变量 UTEN_GOODS_OWNER_SCOPE_ENABLED=true）即恢复按归属人+授权过滤。
    goods-owner-scope-enabled: ${UTEN_GOODS_OWNER_SCOPE_ENABLED:false}
  audit:
    retention:
      enabled: ${UTEN_AUDIT_RETENTION_ENABLED:true}
      # 每天北京时间 03:17 执行；留存月数由「系统设置」动态读取。
      cron: ${UTEN_AUDIT_RETENTION_CRON:0 17 3 * * *}
  http:
    # JSON API 请求体的全局上限；覆盖 chunked 请求。multipart/二进制上传不走此限制。
    max-json-body-bytes: ${UTEN_MAX_JSON_BODY_BYTES:1048576}
  policy-intelligence:
    enabled: ${UTEN_POLICY_INTELLIGENCE_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    refresh-cron: ${UTEN_POLICY_INTELLIGENCE_CRON:0 15 6 * * *}
    max-candidates: ${UTEN_POLICY_INTELLIGENCE_MAX_CANDIDATES:12}
  jwt:
    # 必填：HS256 密钥（≥32 字节）。走 server/.env 的 UTEN_JWT_SECRET 或环境变量；缺省 fail-fast。
    secret: ${UTEN_JWT_SECRET}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
    issuer: ${UTEN_JWT_ISSUER:uten-imp-dev}
  security:
    cors-allowed-origins: ${UTEN_CORS_ORIGINS:http://localhost:53764,http://localhost:8080}
    login-rate-limit-per-minute: 5
    export-max-concurrent: ${UTEN_EXPORT_MAX_CONCURRENT:2}
    lockout-threshold: 5
    lockout-minutes: 15
    password-history-size: 5
    # 安全基线默认关闭；application-dev.yml 才为本地开发显式开启。
    swagger-enabled: ${UTEN_SWAGGER_ENABLED:false}
  crypto:
    # 必填：pgcrypto 主密钥（PII 加密）。走 server/.env 或环境变量；缺省 fail-fast。生产放 Vault/KMS。
    pgp-master-key: ${UTEN_PGP_MASTER_KEY}
    # 密钥版本（密文前缀 v<version>:，便于轮换）；旧密钥放 pgp-legacy-keys 解历史密文。
    pgp-key-version: ${UTEN_PGP_KEY_VERSION:1}
    # 必填：HMAC 密钥（身份证号查重）。走 server/.env 或环境变量；缺省 fail-fast。
    hmac-key: ${UTEN_HMAC_KEY}
  bootstrap:
    admin-login: admin
    # 仅空库首次创建 admin 时必填；账号已存在后可从密钥管理中删除。首登强制改密。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  sms:
    # 网关：log（开发期模拟发送，验证码不写日志）/ aliyun（阿里云，需配 AK/SK/签名/模板）
    provider: ${UTEN_SMS_PROVIDER:disabled}
    expose-code: ${UTEN_SMS_EXPOSE_CODE:false}
    access-key-id: ${UTEN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${UTEN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${UTEN_SMS_SIGN_NAME:}
    template-code: ${UTEN_SMS_TEMPLATE_CODE:}
    endpoint: ${UTEN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    code-ttl-minutes: 5
    send-interval-seconds: 60
    daily-limit: 10
  reporting:
    materialized-view-refresh:
      enabled: ${UTEN_REPORT_REFRESH_ENABLED:true}
      interval-ms: ${UTEN_REPORT_REFRESH_INTERVAL_MS:300000}
      initial-delay-ms: ${UTEN_REPORT_REFRESH_INITIAL_DELAY_MS:60000}

app:
  legacy:
    # 老库（SQL Server YTDQ_2023）迁移数据源；默认关，迁移时显式 UTEN_LEGACY_ENABLED=true
    enabled: ${UTEN_LEGACY_ENABLED:false}
    datasource-url: ${UTEN_LEGACY_DB_URL:}
    datasource-username: ${UTEN_LEGACY_DB_USER:}
    datasource-password: ${UTEN_LEGACY_DB_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.uten.imp: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
