# Install only after read-only preflight passes as uten-imp. This is a drop-in
# for the current deploy/simple/units/uten-imp.service; it grants no new paths.
[Unit]
AssertPathIsMountPoint=/var/lib/uten-imp-media
RequiresMountsFor=/var/lib/uten-imp-media/attachments

[Service]
ExecStartPre=/usr/bin/python3 -I /usr/local/lib/uten-imp/validate-company-files-storage.py --policy /etc/uten-imp/company-files-storage.json
