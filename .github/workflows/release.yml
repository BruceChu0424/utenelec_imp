name: Signed production release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_initial_bootstrap:
        description: >-
          Type CREATE_INITIAL_CANDIDATE_POINTER and dispatch this workflow against
          the protected release tag that points to current main.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One global production lane prevents different release tags from racing LATEST.
  group: signed-production-release
  cancel-in-progress: false

jobs:
  validate-source:
    name: Protected source gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a canonical version from the current main commit
        shell: bash
        env:
          BOOTSTRAP_CONFIRMATION: ${{ inputs.confirm_initial_bootstrap }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              test -z "$BOOTSTRAP_CONFIRMATION"
              ;;
            workflow_dispatch)
              test "$BOOTSTRAP_CONFIRMATION" = CREATE_INITIAL_CANDIDATE_POINTER || {
                echo "Initial bootstrap confirmation is not exact." >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported release event." >&2
              exit 1
              ;;
          esac
          test "$RELEASE_REF_TYPE" = "tag" || {
            echo "Release workflow accepts tag refs only." >&2
            exit 1
          }
          test "$RELEASE_REF_PROTECTED" = "true" || {
            echo "Release tag is not covered by a GitHub ruleset/protection rule." >&2
            exit 1
          }
          python3 deploy/release/release_tools.py validate-version --version "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA" || {
            echo "Release tags must point exactly to the current origin/main commit." >&2
            exit 1
          }

      - name: Require GitHub branch protection on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/main-branch.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if value.get("protected") is True else "main is not protected")' "$response"

  build-release-candidate:
    name: Test and build unsigned release candidate
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
    steps:
      # This job intentionally has no environment and no release/cloud secret.
      # Repository tests and dependency code can never share a process boundary with them.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Re-check immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/release/release_tools.py validate-version --version "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend clean build, tests, migrations, and SBOM
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: mvn -f server/pom.xml --batch-mode --no-transfer-progress clean verify

      - name: Export canonical Flyway checksums with Flyway itself
        shell: bash
        run: |
          set -euo pipefail
          CHECKSUMS="server/target/uten-imp-flyway-checksums.tsv"
          mvn -f server/pom.xml --batch-mode --no-transfer-progress \
            -Dtest=FlywayChecksumManifestExporterTest \
            -Duten.exportFlywayChecksums=true test
          test -s "$CHECKSUMS"
          test "$(head -n 1 "$CHECKSUMS")" = "# uten-imp-flyway-checksums-v1"
          test "$(( $(wc -l < "$CHECKSUMS") - 1 ))" -eq \
            "$(find server/src/main/resources/db/migration -maxdepth 1 -type f -name 'V*.sql' | wc -l)"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Frontend quality gate and production build
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub
          node --test web/update_check.test.cjs
          pwsh -NoLogo -NoProfile -File .github/scripts/verify-font-assets.ps1
          flutter build web --release --no-pub --no-web-resources-cdn \
            --dart-define="APP_VERSION=$GITHUB_REF_NAME" \
            --dart-define=API_BASE_URL=/api

      - name: Test release, updater, backup, setup, monitoring, and cloud policy helpers
        run: |
          python3 -m unittest discover -s deploy/updater -p "test*.py" -v
          python3 -m unittest discover -s deploy/postgres/backup -p "test*.py" -v
          python3 -m unittest discover -s deploy/setup -p "test*.py" -v
          python3 -m unittest discover -s deploy/monitoring -p "test*.py" -v
          python3 -m unittest discover -s deploy/aliyun-oidc -p "test*.py" -v

      - name: Validate deployment templates and script syntax
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File deploy/verify-templates.ps1
          mapfile -d '' shell_scripts < <(
            find deploy website/deploy -type f -name '*.sh' -print0 | sort -z
          )
          test "${#shell_scripts[@]}" -gt 0
          for script in "${shell_scripts[@]}"; do
            bash -n "$script"
          done
          # Verify the exact reviewed graph in an isolated --root fixture.  The
          # contract supplies every referenced unit and executable, so success
          # cannot depend on packages or units preinstalled on the CI runner.
          python3 -m unittest discover \
            -s deploy/setup \
            -p "test_prepare_existing_test_host_internal_runtime.py" \
            -k SystemdProspectiveContractTest \
            -v
          # That contract installs nginx-uten-imp-override.conf.example under
          # nginx.service.d, installs the PostgreSQL storage drop-in, and runs
          # systemd-analyze verify against the exact merged graph.
          test -s deploy/systemd/nginx-uten-imp-override.conf.example
          test -s deploy/systemd/postgresql-uten-imp-storage.conf.example
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(
              path
              for root in (Path("deploy"), Path("website/deploy"))
              for path in root.rglob("*.py")
          )
          if not paths:
              raise SystemExit("no deployment Python files found")
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"validated {len(paths)} deployment Python files")
          PY

      - name: Build and network-isolate test updater wheelhouse
        shell: bash
        run: |
          set -euo pipefail
          SUPPLY_CHAIN="$RUNNER_TEMP/updater-supply-chain"
          SOURCE_TIMESTAMP="$(date -u -d "@$(git show -s --format=%ct "$GITHUB_SHA")" +'%Y-%m-%dT%H:%M:%SZ')"
          bash deploy/updater/build-wheelhouse.sh \
            --output "$SUPPLY_CHAIN" --commit "$GITHUB_SHA" --timestamp "$SOURCE_TIMESTAMP"
          bash deploy/updater/test-wheelhouse-offline.sh --supply-chain "$SUPPLY_CHAIN"

      - name: Assemble minimal payload, SHA-256 inventory, and SBOMs
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          COMMIT="$GITHUB_SHA"
          SHORT_COMMIT="${COMMIT:0:12}"
          ARTIFACT="uten-imp-$V-$SHORT_COMMIT.tar.gz"
          PAYLOAD="dist/$V"
          META="dist/release-metadata"
          BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$COMMIT")"
          FLYWAY_CHECKSUMS="server/target/uten-imp-flyway-checksums.tsv"

          mapfile -t jars < <(find server/target -maxdepth 1 -type f -name 'uten-imp-server-*.jar' -print)
          test "${#jars[@]}" -eq 1 || {
            echo "Expected exactly one executable backend JAR, found ${#jars[@]}." >&2
            exit 1
          }
          MIGRATOR_JAR="server/target/uten-imp-migrator.jar"
          [[ -f "$MIGRATOR_JAR" && ! -L "$MIGRATOR_JAR" && -s "$MIGRATOR_JAR" ]] || {
            echo "Standalone migrator JAR is missing or unsafe." >&2
            exit 1
          }
          BACKEND_SBOM="server/target/classes/META-INF/sbom/application.cdx.json"
          test -s "$BACKEND_SBOM"
          test -s "$FLYWAY_CHECKSUMS"

          install -d -m 0755 \
            "$PAYLOAD/server" "$PAYLOAD/web" "$PAYLOAD/sbom/updater" "$META"
          install -m 0644 "${jars[0]}" "$PAYLOAD/server/uten-imp-server.jar"
          install -m 0644 "$MIGRATOR_JAR" "$PAYLOAD/server/uten-imp-migrator.jar"
          cp -a build/web/. "$PAYLOAD/web/"
          install -m 0644 "$BACKEND_SBOM" "$PAYLOAD/sbom/backend.cdx.json"
          cp -a "$RUNNER_TEMP/updater-supply-chain/." "$PAYLOAD/sbom/updater/"
          python3 deploy/release/release_tools.py stamp-web \
            --web-root "$PAYLOAD/web" --version "$V" --commit "$COMMIT"
          dart pub deps --json > "$RUNNER_TEMP/dart-pub-deps.json"
          python3 deploy/release/release_tools.py flutter-sbom \
            --input "$RUNNER_TEMP/dart-pub-deps.json" \
            --output "$PAYLOAD/sbom/flutter.cdx.json" \
            --version "$V" --commit "$COMMIT" --timestamp "$BUILT_AT"
          if find "$PAYLOAD" -type l -print -quit | grep -q .; then
            echo "Release payload contains a symbolic link." >&2
            exit 1
          fi
          find "$PAYLOAD" -type d -exec chmod 0755 {} +
          find "$PAYLOAD" -type f -exec chmod 0644 {} +
          python3 deploy/release/release_tools.py checksums \
            --root "$PAYLOAD" --output "$PAYLOAD/SHA256SUMS"
          chmod 0644 "$PAYLOAD/SHA256SUMS"

          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
            --numeric-owner -C dist -cf - "$V" | gzip -n -9 > "dist/$ARTIFACT"
          (cd dist && sha256sum "$ARTIFACT" > "$ARTIFACT.sha256")

          {
            echo "version=$V"
            echo "commit=$COMMIT"
            echo "artifact=$ARTIFACT"
            echo "payload=$PAYLOAD"
            echo "meta=$META"
            echo "built_at=$BUILT_AT"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
            echo "flyway_checksums=$FLYWAY_CHECKSUMS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and strictly verify unsigned manifest template
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLACEHOLDER_KEY_ID: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        run: |
          set -euo pipefail
          V="${{ steps.bundle.outputs.version }}"
          ARTIFACT="${{ steps.bundle.outputs.artifact }}"
          PAYLOAD="${{ steps.bundle.outputs.payload }}"
          META="${{ steps.bundle.outputs.meta }}"
          VERIFY_DIR="$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")"
          trap 'rm -rf -- "$VERIFY_DIR"' EXIT

          python3 deploy/release/release_tools.py manifest \
            --payload-root "$PAYLOAD" \
            --artifact "dist/$ARTIFACT" \
            --artifact-object-key "releases/$V/$ARTIFACT" \
            --flyway-dir server/src/main/resources/db/migration \
            --flyway-checksums "${{ steps.bundle.outputs.flyway_checksums }}" \
            --version "$V" --commit "${{ steps.bundle.outputs.commit }}" \
            --source-ref "$GITHUB_REF" --built-at "${{ steps.bundle.outputs.built_at }}" \
            --signing-key-id "$PLACEHOLDER_KEY_ID" \
            --output "$META/manifest.template.json"
          python3 deploy/updater/release_guard.py validate-manifest \
            --manifest "$META/manifest.template.json" --expected-version "$V"
          python3 deploy/updater/release_guard.py verify-bundle \
            --manifest "$META/manifest.template.json" \
            --archive "dist/$ARTIFACT" --destination-parent "$VERIFY_DIR"
          (cd dist && sha256sum --check "$ARTIFACT.sha256")

      - name: Seal exact unsigned candidate for cross-job transfer
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.bundle.outputs.artifact }}"
          META="${{ steps.bundle.outputs.meta }}"
          PAYLOAD="${{ steps.bundle.outputs.payload }}"
          CANDIDATE="dist/publish-candidate"
          SOURCE_DATE_EPOCH="${{ steps.bundle.outputs.source_date_epoch }}"
          install -d -m 0755 "$CANDIDATE"
          install -m 0644 "dist/$ARTIFACT" "$CANDIDATE/$ARTIFACT"
          install -m 0644 "dist/$ARTIFACT.sha256" "$CANDIDATE/$ARTIFACT.sha256"
          install -m 0644 "$META/manifest.template.json" "$CANDIDATE/manifest.template.json"
          install -m 0644 "$PAYLOAD/sbom/backend.cdx.json" "$CANDIDATE/backend.cdx.json"
          install -m 0644 "$PAYLOAD/sbom/flutter.cdx.json" "$CANDIDATE/flutter.cdx.json"
          install -m 0644 \
            "$PAYLOAD/sbom/updater/updater-wheelhouse.attestation.json" \
            "$CANDIDATE/updater-wheelhouse.attestation.json"
          (
            cd "$CANDIDATE"
            sha256sum -- \
              "$ARTIFACT" "$ARTIFACT.sha256" \
              backend.cdx.json flutter.cdx.json manifest.template.json \
              updater-wheelhouse.attestation.json \
              > PUBLISH_SHA256SUMS
          )
          chmod 0644 "$CANDIDATE/PUBLISH_SHA256SUMS"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
            --numeric-owner -C "$CANDIDATE" -cf dist/publish-candidate.tar \
            PUBLISH_SHA256SUMS "$ARTIFACT" "$ARTIFACT.sha256" \
            backend.cdx.json flutter.cdx.json manifest.template.json \
            updater-wheelhouse.attestation.json
          test -s dist/publish-candidate.tar

      - name: Upload immutable unsigned candidate to GitHub artifact storage
        id: upload-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uten-imp-unsigned-${{ github.sha }}
          path: dist/publish-candidate.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  publish-release:
    name: Isolated verify, sign, and publish
    needs:
      - validate-source
      - build-release-candidate
    outputs:
      signed-artifact-digest: ${{ steps.upload-signed-candidate.outputs.artifact-digest }}
      signed-artifact-id: ${{ steps.upload-signed-candidate.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-release-publisher
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # No checkout is permitted in this job. It never executes repository scripts,
      # build dependencies, or any byte from the downloaded application candidate.
      - name: Revalidate protected main and release ref on the isolated runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF_TYPE" = tag
          test "$RELEASE_REF_PROTECTED" = true
          response="$RUNNER_TEMP/main-isolated.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main"
          python3 -c 'import json,os,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); protected=value.get("protected") is True; head=value.get("commit", {}).get("sha"); sys.exit(0 if protected and head == os.environ["GITHUB_SHA"] else "main moved or lost protection on isolated runner")' "$response"

      - name: Locate the one current-run artifact and bind its service digest
        id: artifact
        shell: bash
        env:
          BUILD_ARTIFACT_DIGEST: ${{ needs.build-release-candidate.outputs.artifact-digest }}
          BUILD_ARTIFACT_ID: ${{ needs.build-release-candidate.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_name="uten-imp-unsigned-$GITHUB_SHA"
          metadata="$RUNNER_TEMP/current-run-artifacts.json"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --get \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "name=$artifact_name" \
            --output "$metadata" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts"
          python3 - "$metadata" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import sys

          metadata_path, output_path = sys.argv[1:]
          with open(metadata_path, encoding="utf-8") as metadata_file:
              value = json.load(metadata_file)
          artifacts = value.get("artifacts")
          expected_name = f"uten-imp-unsigned-{os.environ['GITHUB_SHA']}"
          if value.get("total_count") != 1 or not isinstance(artifacts, list) or len(artifacts) != 1:
              raise SystemExit("expected exactly one current-run unsigned release artifact")
          artifact = artifacts[0]
          workflow_run = artifact.get("workflow_run")
          digest = artifact.get("digest")
          artifact_id = artifact.get("id")
          size = artifact.get("size_in_bytes")
          if artifact.get("name") != expected_name or artifact.get("expired") is not False:
              raise SystemExit("artifact name/expiry metadata differs from the release contract")
          if not isinstance(workflow_run, dict) or workflow_run.get("id") != int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("artifact was not produced by this workflow run")
          if workflow_run.get("head_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("artifact head SHA differs from the protected release commit")
          if not isinstance(artifact_id, int) or artifact_id < 1:
              raise SystemExit("artifact ID is invalid")
          if not isinstance(size, int) or size < 1 or size > 3 * 1024 * 1024 * 1024:
              raise SystemExit("artifact archive size is outside the release limit")
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("GitHub artifact service did not provide a canonical SHA-256")
          build_digest = os.environ.get("BUILD_ARTIFACT_DIGEST", "")
          build_id = os.environ.get("BUILD_ARTIFACT_ID", "")
          if not re.fullmatch(r"[0-9a-f]{64}", build_digest):
              raise SystemExit("upload-artifact output is not a bare SHA-256 digest")
          if digest.removeprefix("sha256:") != build_digest or str(artifact_id) != build_id:
              raise SystemExit("artifact service metadata differs from the upload action outputs")
          with open(output_path, "a", encoding="utf-8", newline="\n") as output:
              output.write(f"artifact_id={artifact_id}\n")
              output.write(f"artifact_digest={digest.removeprefix('sha256:')}\n")
              output.write(f"artifact_size={size}\n")
          PY

      - name: Download and verify the exact GitHub artifact archive
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/unsigned-release.zip"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --max-filesize 3221225472 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$zip_path" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          test "$(stat -c '%s' -- "$zip_path")" = "$ARTIFACT_SIZE"
          printf '%s  %s\n' "$ARTIFACT_DIGEST" "$zip_path" | sha256sum --check --status
          python3 - "$zip_path" "$RUNNER_TEMP/publish-candidate.tar" <<'PY'
          import os
          import shutil
          import stat
          import sys
          import zipfile

          source, destination = sys.argv[1:]
          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              if len(infos) != 1 or infos[0].filename != "publish-candidate.tar":
                  raise SystemExit("GitHub artifact ZIP must contain only publish-candidate.tar")
              info = infos[0]
              mode = (info.external_attr >> 16) & 0xFFFF
              if info.is_dir() or (mode and not stat.S_ISREG(mode)):
                  raise SystemExit("GitHub artifact member is not a regular file")
              if info.file_size < 1 or info.file_size > 3 * 1024 * 1024 * 1024:
                  raise SystemExit("publish candidate size is outside the release limit")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(destination, flags, 0o600)
              try:
                  with archive.open(info) as reader, os.fdopen(descriptor, "wb") as writer:
                      shutil.copyfileobj(reader, writer, length=1024 * 1024)
                      writer.flush()
                      os.fsync(writer.fileno())
              except Exception:
                  try:
                      os.close(descriptor)
                  except OSError:
                      pass
                  raise
          PY
          rm -f -- "$zip_path"

      - name: Re-verify candidate structure, digests, and unsigned manifest without project code
        shell: bash
        env:
          PLACEHOLDER_KEY_ID: SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/release-candidate"
          install -d -m 0700 "$candidate_dir" "$RUNNER_TEMP/signed-meta"
          python3 - "$RUNNER_TEMP/publish-candidate.tar" "$candidate_dir" <<'PY'
          import base64
          import binascii
          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          import tarfile
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          import zlib

          candidate_tar, destination = sys.argv[1:]
          version = os.environ["GITHUB_REF_NAME"]
          commit = os.environ["GITHUB_SHA"]
          placeholder = os.environ["PLACEHOLDER_KEY_ID"]
          version_match = re.fullmatch(
              r"v(?P<year>[0-9]{4})\.(?P<month>[0-9]{2})\.(?P<day>[0-9]{2})-(?P<counter>[0-9]{1,3})",
              version,
          )
          if not version_match:
              raise SystemExit("release version is not canonical")
          counter = int(version_match.group("counter"))
          if counter < 1 or version_match.group("counter") != str(counter):
              raise SystemExit("release counter is not canonical")
          try:
              day = dt.date(
                  int(version_match.group("year")),
                  int(version_match.group("month")),
                  int(version_match.group("day")),
              )
          except ValueError as exc:
              raise SystemExit(f"release date is invalid: {exc}") from exc
          sequence = int(day.strftime("%Y%m%d")) * 1000 + counter
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("release commit is not a full SHA-1")
          artifact = f"uten-imp-{version}-{commit[:12]}.tar.gz"
          expected_files = {
