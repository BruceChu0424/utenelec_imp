group 'com.example.desktop_drop'
version '1.0-SNAPSHOT'

// Use the host's AGP and Kotlin toolchain. Flutter 3.44 supplies the legacy
// Kotlin compatibility plugin; AGP 9 built-in Kotlin owns this in newer hosts.
apply plugin: 'com.android.library'

android {
    namespace 'one.mixin.desktop.drop'
    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 16
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
