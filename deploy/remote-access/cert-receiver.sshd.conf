# Included only at the end of sshd_config. Keep all ordinary administrator rules.
Match User uten-cert-receiver
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/authorized_keys/uten-cert-receiver
    ForceCommand /usr/bin/python3 -I /usr/local/lib/uten-remote/cert_receiver.py
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
