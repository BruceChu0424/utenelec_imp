name: Dependency Vulnerability Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    name: Generate dependency inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Generate transitive Maven SBOM
        working-directory: server
        run: mvn --batch-mode --no-transfer-progress -DskipTests verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: osv-inputs
          path: |
            server/target/classes/META-INF/sbom/application.cdx.json
            pubspec.lock
            osv-scanner.toml
          if-no-files-found: error
          retention-days: 1

  scan:
    needs: prepare
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      download-artifact: osv-inputs
      upload-sarif: false
      fail-on-vuln: true
      # 例外只经 osv-scanner.toml 登记(每条带原因、守护测试与到期日), 随输入制品一起下发。
      scan-args: |-
        --config
        ./osv-scanner.toml
        --sbom
        ./server/target/classes/META-INF/sbom/application.cdx.json
        --lockfile
        ./pubspec.lock
    permissions:
      actions: read
      contents: read
      # The pinned reusable workflow declares this permission unconditionally,
      # even when upload-sarif is disabled.
      security-events: write
