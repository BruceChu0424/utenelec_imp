function contextRow(name,depth,key,label,code='',sub=''){return '<tr class="context '+(depth===0?'root':'')+'"><td class="check"></td><td><span class="pill teal">'+label+'</span></td><td>—</td><td class="tree-col">'+treeCell(name,depth,true,key,sub)+'</td><td>'+esc(label==='无需总装'?'按订单交付要求':'本层不组装，直属下级交付')+'</td><td>'+esc(code)+'</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td></tr>';}

function renderAnalysisTable(){displayedSources=[];const all=mergeContributions(activeAnalysis),search=($('#bom-search')?.value||'').trim().toLowerCase();const allocations=new Map(),remaining=new Map();const pathKey=c=>JSON.stringify([c.lineId,c.group,c.code,c.identity]);for(const line of activeAnalysis)for(const c of lineContributions(line)){const key=JSON.stringify([c.code,c.spec,c.color,c.unit,c.process,c.identity]);if(!remaining.has(key))remaining.set(key,sampleStock[c.code]??0);const allocated=Math.min(c.per*c.qty,remaining.get(key));allocations.set(pathKey(c),allocated);remaining.set(key,remaining.get(key)-allocated);}const project=c=>({...c,allocatedStock:allocations.get(pathKey(c))??0});const match=c=>(state.filter==='all'||(state.filter==='shortage'&&inventory(c).shortage>0)||(state.filter==='route'&&!hasRoute(c)))&&(!search||[c.name,c.code,c.group].join(' ').toLowerCase().includes(search));let html='';
 if(state.view==='material'){for(const c of all.filter(match)){html+=materialRow(c,0,c.key,true);if(state.openSources.includes(c.key))for(const s of c.sources)html+=materialRow({...s,total:s.per*s.qty},1,c.key+'-'+s.lineId+'-'+s.group,false,true);}}
 else{for(const line of activeAnalysis){const rootKey=line.id+'-root';let part='';if(line.mode==='assembled'){const c=project(lineContributions(line)[0]);if(match(c))part=materialRow(c,0,line.id+'-product');}else{const list=lineContributions(line).map(project);for(const g of groups){const children=list.filter(c=>c.groupId===g.id);const gkey=line.id+'-'+g.id;if(split(g,line)){const visible=children.filter(match);if(visible.length){part+=contextRow(g.name,1,gkey,'无需该层组装',g.code);if(!state.collapsed.includes(gkey))part+=visible.map((c,i)=>materialRow(c,2,line.id+'-'+g.id+'-'+c.code)).join('');}}else if(children.some(match))part+=children.filter(match).map(c=>materialRow(c,1,gkey)).join('');}if(part){html+=contextRow(product.name,0,rootKey,'无需总装',product.code,'DEMO-XD0001 / '+lineLabel(line.id)+' / '+fmt(line.qty)+' 个 / '+deliveryName(line));if(!state.collapsed.includes(rootKey))html+=part;}part='';}html+=part;}}
 $('#analysis-table-scroll').innerHTML=tableHeader()+html+'</tbody></table>'+(!html?'<div class="empty">当前条件下没有匹配物料。</div>':'');$('#table-status').textContent=state.view==='material'?'按物料汇总共 '+all.filter(match).length+' 种交付件；展开圆形箭头可看各功能件来源，公共可用数量仅在汇总行显示。':'按产品保留原 BOM 结构；不组装的功能件只作上下文，不产生本层需求。可用数量按来源顺序分配，不重复使用公共库存。';renderFloating();}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.id;if(b.hasAttribute('data-close'))closeModal();if(b.dataset.config)openConfig(b.dataset.config);if(b.dataset.configMode){draftConfig.mode=b.dataset.configMode;renderConfig();}if(id==='config-all'){draftConfig.choices={left:true,middle:true,right:true};renderConfig();}if(id==='confirm-config'){const d=draftConfig;state.rows=state.rows.map(r=>r.id===d.id?{...d}:r);closeModal();renderSales();markDirty();}if(b.dataset.field)genericOptions(b.dataset.field);if(b.dataset.fieldOption){state.fields[b.dataset.fieldOption]=b.dataset.value;closeModal();renderForm();markDirty();}if(id==='save-sales')saveSales();if(id==='approve-to-plan'){state.approved=true;closeModal();showPage('plan');}if(id==='goto-plan')toPlan();if(id==='page-back'){if(state.page==='plan')showPage('sales');else pagePicker();}if(id==='workspace-nav')pagePicker();if(id==='toggle-rail')$('#rail').classList.toggle('expanded');if(id==='open-guide')help();if(id==='download-html'||id==='save-html-feedback')saveHtml();if(id==='download-feedback')download('交付方式方案-确认意见.txt','\ufeff订单交付方式方案 / 确认意见\r\n\r\n'+(state.feedback||'未填写')+'\r\n\r\n当前配置：\r\n'+state.rows.map((r,i)=>'第'+(i+1)+'行 '+product.code+' '+r.qty+'个 / '+deliveryName(r)+' / '+groups.map(g=>g.short+':'+(r.mode==='assembled'?'整装':split(g,r)?'直属下级':'整件')).join('；')).join('\r\n'),'text/plain;charset=utf-8');if(id==='more-actions')openModal('更多操作','离线演示','<button class="text" id="open-guide">演示说明与反馈</button><br><button class="text" id="download-html">下载完整 HTML</button><br><button class="text" id="switch-sales">销售订货单</button><br><button class="text" id="goto-plan">物料分析准备</button>');if(id==='switch-sales'){closeModal();showPage('sales');}if(id==='run-analysis')runAnalysis();if(id==='clear-candidates'){state.planSelected=[];renderPlan();}if(id==='cancel-analysis'){state.analyzed=false;selectedMaterials.clear();renderPlan();}if(id==='refresh-analysis'){renderAnalysis();toast('已按内嵌虚构库存重新计算，销售交付要求保留。');}if(id==='linked-order'||id==='linked-order-candidate')orderReadOnly();if(b.dataset.showConfig)readOnlyConfig(b.dataset.showConfig);if(id==='sales-requirements'){openModal('销售生产要求','全部本次分析订单行 / 计划部只读',activeAnalysis.map((r,i)=>'<div class="source-card"><strong>DEMO-XD0001 / '+esc(lineLabel(r.id))+' / '+fmt(r.qty)+' 个</strong><p>'+esc(product.name)+' / '+esc(deliveryName(r))+'</p><p>'+groups.map(g=>esc(g.short)+': '+(r.mode==='assembled'?'包含在成品内':split(g,r)?'直属下级交付':'功能件整件')).join('；')+'</p><button class="text small" data-show-config="'+r.id+'">查看本行功能件要求</button></div>').join(''));}if(id==='summary')summaryDialog();if(b.hasAttribute('data-source'))sourceDialog(displayedSources[Number(b.dataset.source)]);if(b.hasAttribute('data-handle'))sourceDialog(displayedSources[Number(b.dataset.handle)]);if(b.dataset.treeToggle){const k=b.dataset.treeToggle;state.collapsed=state.collapsed.includes(k)?state.collapsed.filter(v=>v!==k):[...state.collapsed,k];renderAnalysisTable();}if(b.hasAttribute('data-source-toggle')){const c=displayedSources[Number(b.dataset.sourceToggle)];state.openSources=state.openSources.includes(c.key)?state.openSources.filter(v=>v!==c.key):[...state.openSources,c.key];renderAnalysisTable();}if(b.dataset.treeView){state.view=b.dataset.treeView;selectedMaterials.clear();renderAnalysis();}if(b.dataset.filter){state.filter=b.dataset.filter;selectedMaterials.clear();renderAnalysis();}if(id==='expand-all'){state.collapsed=[];renderAnalysisTable();}if(id==='collapse-all'){state.collapsed=activeAnalysis.map(r=>r.id+'-root');renderAnalysisTable();}if(id==='fullscreen'){fullTable=!fullTable;$('#analysis-table-area').classList.toggle('full-table',fullTable);b.textContent=fullTable?'退出全屏':'全屏';}if(id==='export-analysis')exportAnalysis();if(id==='add-line'){addLines(1);}if(id==='add-lines')openModal('添加多行','每行使用同一个演示货品，各行交付配置独立','<label class="field"><span>添加行数</span><input id="add-count" type="number" min="1" max="20" value="3"></label>','<button data-close>取消</button><button class="primary" id="confirm-add-lines">添加</button>');if(id==='confirm-add-lines'){const n=Number($('#add-count').value);if(!Number.isInteger(n)||n<1||n>20){toast('请输入 1～20 行。');return;}closeModal();addLines(n);}if(b.dataset.delete){state.rows=state.rows.filter(r=>r.id!==b.dataset.delete);renderSales();markDirty();}if(id==='cancel-sales'){openModal('恢复上次保存的演示草稿？','本次尚未保存的修改将恢复为上次保存值','<p>确认前可继续保留当前编辑。反馈意见不会清空。</p>','<button data-close>继续编辑</button><button class="primary" id="restore-draft">恢复草稿</button>');}if(id==='restore-draft'){state.rows=state.savedRows.length?JSON.parse(JSON.stringify(state.savedRows)):[makeLine('line-1')];if(state.savedFields){state.fields=JSON.parse(JSON.stringify(state.savedFields));state.remark=state.savedRemark||'';}closeModal();renderForm();renderSales();$('#sales-status').textContent='已恢复演示草稿';snapshot();}if(id==='drafts')openModal('演示草稿','草稿仅包含本文件内保存的内容','<p>'+ (state.savedRows.length?'DEMO-XD0001 / '+state.savedRows.length+' 行 / 虚构数据':'尚未保存演示草稿')+'</p>','<button data-close>关闭</button>'+(state.savedRows.length?'<button class="primary" id="restore-draft">恢复草稿</button>':''));if(b.dataset.product)openModal('选择货品','本演示内置的唯一 BOM 示例','<button class="text" data-close>'+product.code+'　'+product.name+'</button><p class="small muted">为防止给未提供的货品编造 BOM，本次仅使用这一货品的三个功能件摘录。</p>');if(id==='attachment-help')openModal('附件区域示意','本次演示不需要真实合同、客户文件或图片','<p>正式系统的附件区域保留原布局；本次仅确认销售交付方式与计划分析结果，无需提供文件。</p>');if(b.dataset.attachment){$$('[data-attachment]').forEach(x=>x.classList.toggle('active',x===b));}if(id==='sales-columns'||id==='analysis-columns')columnDialog(id==='sales-columns');if(id==='analysis-history')openModal('物料分析记录','仅当前网页内的演示记录','<p>'+(state.analyzed?'DEMO-FX0001 / '+activeAnalysis.length+' 行来源 / 虚构库存':'当前还没有演示分析记录。')+'</p>');if(id==='plan-history'||id==='place-orders'||b.dataset.task)openModal(b.dataset.task||'生产计划演示范围','本次先确认交付方式与物料分析结果','<p>这里沿用正式平台的操作入口。本次未创建采购单、委外单或生产计划；必要加工、库存占用和审核规则将在方案确认后接入验证。</p>');if(b.hasAttribute('data-warehouse'))openModal('选择主仓库','全部库存为虚构示例','<button class="text" data-close>演示主仓库</button>');if(id==='manual-source')openModal('手工需求','本次用销售订单产品演示交付方式流转','<p>请在「销售订单产品」中选中已模拟审核的订单行，再点击「联合分析」。</p>');snapshot();});
function pagePicker(){openModal('演示页面','两页数据相互衔接，均保存在当前文件','<button class="text" id="switch-sales" style="display:block;padding:14px">销售管理 / 新建销售订货单</button><button class="text" id="goto-plan" style="display:block;padding:14px">计划部 / 物料分析准备</button><button class="text" id="open-guide" style="display:block;padding:14px">演示说明与确认意见</button>');}
function addLines(n){const start=Date.now();for(let i=0;i<n;i++){const r=makeLine('line-'+start+'-'+i,1);r.mode='assembled';state.rows.push(r);}renderSales();markDirty();}
function columnDialog(sales){const target=sales?'#sales-grid':'#analysis-table-scroll';const ths=Array.from($(target).querySelectorAll('thead th'));openModal('表头设置','勾选控制当前演示视图的可见列','<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+ths.map((th,i)=>i&&th.textContent.trim()?'<label><input type="checkbox" data-column="'+i+'" data-target="'+target+'" '+(th.style.display==='none'?'':'checked')+'> '+esc(th.textContent.replace('新增','').replace('⌄','').trim())+'</label>':'').join('')+'</div>');}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.configGroup&&draftConfig){draftConfig.choices[el.dataset.configGroup]=el.checked;renderConfig();}if(el.dataset.candidate){state.planSelected=el.checked?[...new Set([...state.planSelected,el.dataset.candidate])]:state.planSelected.filter(v=>v!==el.dataset.candidate);renderPlan();}if(el.id==='candidate-all'){state.planSelected=el.checked?state.savedRows.map(r=>r.id):[];renderPlan();}if(el.id==='sales-check-all')$$('[data-sale-check]').forEach(x=>x.checked=el.checked);if(el.dataset.materialCheck){el.checked?selectedMaterials.add(el.dataset.materialCheck):selectedMaterials.delete(el.dataset.materialCheck);renderFloating();}if(el.id==='materials-all'){$$('[data-material-check]').forEach(x=>{x.checked=el.checked;el.checked?selectedMaterials.add(x.dataset.materialCheck):selectedMaterials.delete(x.dataset.materialCheck);});renderFloating();}if(el.hasAttribute('data-column')){const n=Number(el.dataset.column)+1;$(el.dataset.target).querySelectorAll('tr>*:nth-child('+n+')').forEach(c=>c.style.display=el.checked?'':'none');}snapshot();});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.qty){const r=state.rows.find(r=>r.id===el.dataset.qty);const q=Number(el.value);if(Number.isInteger(q)&&q>=1&&q<=1000000){r.qty=q;el.removeAttribute('aria-invalid');$('#sales-error').textContent='';$('[data-amount="'+r.id+'"]').textContent=money(r.qty*samplePrice*r.discount);renderSalesTotals();}else{$('#sales-error').textContent='数量须为 1～1,000,000 的整数，清单保留上次有效值。';el.setAttribute('aria-invalid','true');}markDirty();}if(el.dataset.discount){const r=state.rows.find(r=>r.id===el.dataset.discount),d=Number(el.value);if(el.value!==''&&Number.isFinite(d)&&d>=0&&d<=1){r.discount=d;el.removeAttribute('aria-invalid');$('[data-amount="'+r.id+'"]').textContent=money(r.qty*samplePrice*r.discount);renderSalesTotals();}markDirty();}if(el.dataset.lineRemark){state.rows.find(r=>r.id===el.dataset.lineRemark).remark=el.value;markDirty();}if(el.dataset.form){state.fields[el.dataset.form]=el.value;markDirty();}if(el.id==='order-remark'){state.remark=el.value;markDirty();}if(el.id==='feedback'){state.feedback=el.value;snapshot();}if(el.id==='bom-search')renderAnalysisTable();if(el.id==='candidate-search'){const q=el.value.toLowerCase();$$('[data-candidate-row]').forEach(tr=>tr.hidden=!tr.textContent.toLowerCase().includes(q));}if(el.dataset.analysisQty){state.planQty[el.dataset.analysisQty]=Number(el.value);snapshot();}});
$('#modal-close').addEventListener('click',closeModal);$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});document.addEventListener('keydown',e=>{if($('#modal').hidden)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const fs=Array.from($('#modal').querySelectorAll('button:not(:disabled),input:not([tabindex="-1"]),textarea')).filter(x=>x.offsetParent!==null);const first=fs[0],last=fs[fs.length-1];if((e.shiftKey&&document.activeElement===first)||(!e.shiftKey&&document.activeElement===last)){e.preventDefault();(e.shiftKey?last:first).focus();}}});
renderForm();showPage(state.page==='plan'&&state.approved?'plan':'sales');
})();
</script></body></html>
