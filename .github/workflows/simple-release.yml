name: Simple Release

# ADR-060 单维护者简化发布链：打 tag 即发布。
# 前置：以只读 API 核验同一提交最新 Quality / CodeQL / OSV 运行全部成功。
# 产物：releases/<version>/{SHA256SUMS,SHA256SUMS.sig,server/*.jar,web/**} + LATEST.txt
# 发布后自动清理 releases/ 下所有旧版本（含历史 object 版本），OSS 只保留最新一版。
# 服务器端由 deploy/simple/uten-imp-updater.sh 拉取验签安装。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 vMAJOR.MINOR.PATCH（语义化）"
        required: true
        type: string
      allow_running_checks:
        description: "明确允许本次手动发布不等待仍在运行的CI（已失败的检查仍阻断）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: simple-release
  cancel-in-progress: false

env:
  # vars（非敏感）：OSS_BUCKET、OSS_ENDPOINT（如 oss-cn-shenzhen.aliyuncs.com）
  # secrets（敏感）：OSS_ACCESS_KEY_ID、OSS_ACCESS_KEY_SECRET、RELEASE_SIGNING_KEY
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  release:
    name: Build, sign, publish to OSS
    runs-on: ubuntu-latest
    # 2026-09-21：跨境传 OSS 的速度一天之内能差一个量级(v1.2.0 全程 10 分钟，
    # v1.3.0 当天上传一小时还没传完一个 JAR)。留足余量，让慢链路跑完而不是被砍。
    timeout-minutes: 330
    steps:
      - name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::版本号必须是 vMAJOR.MINOR.PATCH（语义化），收到 $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "发布版本：$VERSION（commit $GITHUB_SHA）"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release gate offline contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_gate.py' -v

      - name: Require successful workflows for this checkout before building
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RUNNING_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_running_checks }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          GATE_ARGS=()
          if [ "$ALLOW_RUNNING_CHECKS" = "true" ]; then GATE_ARGS+=(--allow-running); fi
          python3 .github/scripts/release_gate.py --sha "$CHECKOUT_SHA" "${GATE_ARGS[@]}"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build server double JAR (tests ran in Quality Gate)
        working-directory: server
        run: mvn $MAVEN_ARGS clean package -DskipTests

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Build Flutter Web
        run: |
          set -euo pipefail
          node --test web/update_check.test.cjs
          flutter pub get
          flutter build web --release --no-pub --no-web-resources-cdn \
            --dart-define="APP_VERSION=$VERSION" \
            --dart-define="APP_BUILD_ID=$GITHUB_SHA" \
            --dart-define=API_BASE_URL=/api

      - name: Assemble release directory
        shell: bash
        run: |
          set -euo pipefail
          test "$(ls server/target/uten-imp-server-*.jar | wc -l)" = 1
          test -f server/target/uten-imp-migrator.jar
          rm -rf dist && mkdir -p dist/server dist/web
          cp server/target/uten-imp-server-*.jar dist/server/uten-imp-server.jar
          cp server/target/uten-imp-migrator.jar dist/server/uten-imp-migrator.jar
          cp -r build/web/. dist/web/
          python3 deploy/release/release_tools.py stamp-web \
            --web-root dist/web --version "$VERSION" --commit "$GITHUB_SHA"
          cd dist
          find . -type f ! -name SHA256SUMS -print0 | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"; cat SHA256SUMS

      - name: Recheck release gates before signing and publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RUNNING_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_running_checks }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          GATE_ARGS=()
          if [ "$ALLOW_RUNNING_CHECKS" = "true" ]; then GATE_ARGS+=(--allow-running); fi
          python3 .github/scripts/release_gate.py --sha "$CHECKOUT_SHA" "${GATE_ARGS[@]}"

      - name: Sign SHA256SUMS (Ed25519)
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$(mktemp /tmp/release-key.XXXXXX)"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keyfile"
          ssh-keygen -y -f "$keyfile" > /tmp/release-key.pub
          echo "签名公钥指纹：$(ssh-keygen -lf /tmp/release-key.pub)"
          cd dist
          ssh-keygen -Y sign -f "$keyfile" -n uten-imp-release SHA256SUMS
          test -f SHA256SUMS.sig
          ssh-keygen -Y verify -f <(echo "uten-imp-release $(cat /tmp/release-key.pub)") \
            -I uten-imp-release -n uten-imp-release -s SHA256SUMS.sig < SHA256SUMS

      - name: Publish to Aliyun OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet oss2==2.19.1
          python3 - "$VERSION" <<'PY'
          import base64, hashlib, os, sys
          from concurrent.futures import ThreadPoolExecutor
          import oss2

          version = sys.argv[1]
          bucket_name = os.environ["OSS_BUCKET"]
          endpoint = os.environ["OSS_ENDPOINT"]
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"],
                           os.environ["OSS_ACCESS_KEY_SECRET"])
          # 2026-09-21 v1.3.0 教训：不设超时时单次 PUT 大 JAR 会在跨境链路上
          # 静默挂死（该次两小时零字节落地，最后被 job 的 120 分钟超时杀掉）。
          # connect_timeout 同时作用于连接与读写，卡住就报错走重试，不再空转。
          bucket = oss2.Bucket(auth, f"https://{endpoint}", bucket_name,
                               connect_timeout=60)

          prefix = f"releases/{version}"
          files = []
          for root, _dirs, names in os.walk("dist"):
              for name in names:
                  path = os.path.join(root, name)
                  key = prefix + path.removeprefix("dist")
                  files.append((path, key))

          # 超过这个大小走分片续传：每片独立重试，断链只重传该片，不从头再来。
          MULTIPART_THRESHOLD = 8 * 1024 * 1024
          PART_SIZE = 4 * 1024 * 1024

          # 完整性口径(2026-09-21 改)：上传带 Content-MD5，OSS 在收件时就拒掉损坏的体；
          # 整体内容另有 Ed25519 已签名的 SHA256SUMS 兜底——更新器下载后逐文件核对，
          # 那才是权威闸门。因此这里不再把每个对象整体回读一遍(Flutter Web 有近两千个
          # 小文件，逐个回读等于把流量和往返翻倍，跨境链路慢的那天会把 job 拖到超时)。
          def upload_one(item):
              path, key = item
              size = os.path.getsize(path)
              if size <= MULTIPART_THRESHOLD:
                  data = open(path, "rb").read()
                  bucket.put_object(key, data, headers={
                      "Content-MD5": base64.b64encode(hashlib.md5(data).digest()).decode()})
                  kind = "put"
              else:
                  oss2.resumable_upload(bucket, key, path,
                                        multipart_threshold=MULTIPART_THRESHOLD,
                                        part_size=PART_SIZE, num_threads=4)
                  kind = "multipart"
              remote = bucket.head_object(key).content_length
              if remote != size:
                  raise SystemExit(f"size mismatch: {key} {remote} != {size}")
              return f"{kind} ok: {key} ({size} bytes)"

          small = sorted(p for p in files if os.path.getsize(p[0]) <= MULTIPART_THRESHOLD)
          large = sorted(p for p in files if os.path.getsize(p[0]) > MULTIPART_THRESHOLD)
          for item in large:  # 大文件自己已经多线程分片，串行做，别抢带宽。
              print(upload_one(item), flush=True)
          done = 0
          with ThreadPoolExecutor(max_workers=16) as pool:
              for line in pool.map(upload_one, small):
                  done += 1
                  if done % 100 == 0 or done == len(small):
                      print(f"  小文件进度 {done}/{len(small)}", flush=True)
          print(f"已上传 {len(large)} 个大文件 + {len(small)} 个小文件", flush=True)

          bucket.put_object("LATEST.txt", (version + "\n").encode())
          got = bucket.get_object("LATEST.txt").read().decode().strip()
          if got != version:
              raise SystemExit(f"LATEST readback mismatch: {got!r}")
          print(f"LATEST.txt -> {version}；共 {len(files)} 个对象")
          PY
          rm -rf dist

      - name: Purge old releases from OSS (keep only this version)
        shell: bash
        # 发布账号 RAM 策略原只有 PutObject/GetObject；若未加 DeleteObject
        # 此步会失败并告警，但不影响发布本身（continue-on-error）。
        continue-on-error: true
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          pip install --quiet oss2==2.19.1
          python3 - "$VERSION" <<'PY'
          import os, sys
          import oss2

          version = sys.argv[1]
          auth = oss2.Auth(os.environ["OSS_ACCESS_KEY_ID"],
                           os.environ["OSS_ACCESS_KEY_SECRET"])
          bucket = oss2.Bucket(auth, f"https://{os.environ['OSS_ENDPOINT']}",
                               os.environ["OSS_BUCKET"])
          keep = f"releases/{version}/"

          try:
              # 桶开了版本控制：普通删除只留删除标记、旧版本仍占存储，
              # 必须列出全部版本（含删除标记）逐版本删除。
              doomed = []  # (key, versionid)
              key_marker, vid_marker = "", ""
              while True:
                  page = bucket.list_object_versions(
                      prefix="releases/", key_marker=key_marker,
                      versionid_marker=vid_marker, max_keys=200)
                  for v in list(page.object_version_list) + list(page.delete_marker_list):
                      if not v.key.startswith(keep):
                          doomed.append((v.key, v.versionid))
                  if not page.is_truncated:
                      break
                  key_marker = page.next_key_marker
                  vid_marker = (getattr(page, "next_versionid_marker", None)
                                or getattr(page, "next_version_id_marker", None) or "")
                  if not key_marker:
                      raise SystemExit("分页标记缺失，中止清理以防误删")

              for key, vid in doomed:
                  bucket.delete_object(key, params={"versionId": vid})
              print(f"已删除旧版本对象 {len(doomed)} 个（保留 {keep}）")

              # LATEST.txt 只保留当前版本
              page = bucket.list_object_versions(prefix="LATEST.txt", max_keys=1000)
              purged = 0
              for v in list(page.object_version_list) + list(page.delete_marker_list):
                  if getattr(v, "is_latest", False):
                      continue
                  bucket.delete_object("LATEST.txt", params={"versionId": v.versionid})
                  purged += 1
              print(f"已清理 LATEST.txt 历史版本 {purged} 个")
          except oss2.exceptions.AccessDenied:
              print("::error::OSS 清理被拒（AccessDenied）：请给发布 RAM 子账号的策略"
                    "追加 DeleteObject 权限（资源：acs:oss:*:*:<bucket>/releases/* 与 LATEST.txt），"
                    "下次发版生效。本次发布不受影响。")
              raise
          PY

      - name: Summary
        shell: bash
        env:
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          ALLOW_RUNNING_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_running_checks }}
        run: |
          {
            echo "## 发布完成：$VERSION"
            echo "- 本次明确允许CI仍在运行时手动发布：$ALLOW_RUNNING_CHECKS；不表示CI已通过"
            echo "- OSS：$OSS_BUCKET@$OSS_ENDPOINT（发布后自动清理旧版本，只保留本版）"
            echo "- 服务器每天 05:00（北京时间）自动检测；纯代码版本自动激活，含迁移的版本需手动 activate；要立即拉取可 SSH：sudo /usr/local/sbin/uten-imp-updater check"
          } >> "$GITHUB_STEP_SUMMARY"
