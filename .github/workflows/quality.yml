name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compare_reference:
        description: Run an additional unfiltered serial reference and compare every test instance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action 对组织仓库强制收费 license；改用固定版本 gitleaks CLI
      # （同一检测引擎，同样读取 .gitleaksignore / gitleaks.toml），无 license 依赖。
      - name: Install pinned gitleaks 8.29.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.29.1/gitleaks_8.29.1_linux_x64.tar.gz
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full git history
        run: gitleaks git . --redact --no-banner --verbose

  # The fast lane remains an early signal. The full gate below requires every
  # discovered Surefire and Failsafe test across isolated, duration-balanced jobs.
  backend-fast:
    name: "Backend / Java 21 (fast: unit + architecture)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit, architecture, and contract tests (DB-gated tests skip by design)
        working-directory: server
        # Exercise build-directory independence in the early lane too.
        run: mvn --batch-mode --no-transfer-progress -Duten.build.directory=target-fast verify

  backend-plan:
    name: Backend / discover complete test inventory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify test partitioning and report reconciliation
        run: python3 -m unittest discover -s .github/scripts -p 'test_backend_test_shards.py' -v
      - name: Discover all tests and balance four complete partitions
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py plan --output server/target-ci-plan --shards 4 --history .github/test-timings/backend.json
      - name: Preserve exact test plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-plan
          path: server/target-ci-plan/
          if-no-files-found: error
          retention-days: 14

  backend-shards:
    name: Backend / DB partition ${{ matrix.shard }}
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # Collect all failures in one run; no partition is allowed to fail silently.
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-test-plan
          path: server/target-ci-plan
      - name: Run complete assigned partition with isolated PostgreSQL
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py run --plan server/target-ci-plan/plan.json --shard ${{ matrix.shard }} --output server/target-ci-reports
      - name: Preserve test results and timings even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: |
            server/target-ci-reports/
            !server/target-ci-reports/**/tmp/**
          if-no-files-found: error
          retention-days: 14

  backend-reference:
    name: Backend / optional unfiltered reference
    needs: backend-plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RUN_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_reference }}
    steps:
      # A successful no-op job in ordinary runs preserves the release gate's
      # pending-job contract; the complete sharded suite is always mandatory.
      - name: Ordinary run uses the complete parallel suite
        if: env.RUN_REFERENCE != 'true'
        run: echo 'Additional serial comparison was not requested; all full-suite partitions remain required.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_REFERENCE == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        if: env.RUN_REFERENCE == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.RUN_REFERENCE == 'true'
        with:
          name: backend-test-plan
          path: server/target-ci-plan
      - name: Original unfiltered serial Maven verify on the same Linux environment
        if: env.RUN_REFERENCE == 'true'
        env:
          UTEN_RUN_DB_TESTS: "true"
        run: python3 .github/scripts/backend_test_shards.py baseline --plan server/target-ci-plan/plan.json --output server/target-ci-reference
      - name: Preserve unfiltered reference even after failure
        if: always() && env.RUN_REFERENCE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-unfiltered-reference
          path: |
            server/target-ci-reference/
            !server/target-ci-reference/**/tmp/**
          if-no-files-found: error
          retention-days: 14

  backend-db:
    # Preserve the existing required-check name. Success means all four complete
    # partitions passed AND their actual reports reconcile with the discovered plan.
    name: "Backend / Java 21 (full: DB full-chain)"
    needs: [backend-plan, backend-shards, backend-reference]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-test-plan
          path: server/target-ci-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-test-results-*
          path: server/target-ci-reports
          merge-multiple: true
      - name: Collect unfiltered reference after all producers finish
        if: github.event_name == 'workflow_dispatch' && inputs.compare_reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-unfiltered-reference
          path: server/target-ci-reference
      - name: Require successful jobs and reconcile complete test coverage
        env:
          PLAN_RESULT: ${{ needs.backend-plan.result }}
          PARTITION_RESULT: ${{ needs.backend-shards.result }}
          REFERENCE_RESULT: ${{ needs.backend-reference.result }}
          COMPARE_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.compare_reference }}
        run: |
          python3 .github/scripts/backend_test_shards.py verify --plan server/target-ci-plan/plan.json --reports server/target-ci-reports
          if [ "$COMPARE_REFERENCE" = true ]; then
            python3 .github/scripts/backend_test_shards.py compare --plan server/target-ci-plan/plan.json --reports server/target-ci-reports --reference server/target-ci-reference
          fi
          test "$PLAN_RESULT" = success
          test "$PARTITION_RESULT" = success
          test "$REFERENCE_RESULT" = success
      - name: Preserve complete-suite reconciliation and future scheduling hints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-summary
          path: |
            server/target-ci-reports/verification.json
            server/target-ci-reports/timings.json
            server/target-ci-reports/comparison.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Flutter / Web
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Verify browser draft reset, receipts, and exact material quantities
        run: >-
          flutter test --no-pub --platform chrome
          test/shared/drafts/form_draft_storage_browser_test.dart
          test/shared/drafts/form_draft_history_browser_test.dart
          test/device_audit_receipt_storage_web_test.dart
          test/features/production/models/material_quantity_apportionment_test.dart
      - name: Verify version-pinned local font assets
        shell: pwsh
        run: ./.github/scripts/verify-font-assets.ps1
      - name: Build production web bundle
        run: flutter build web --release --no-pub --no-web-resources-cdn --no-wasm-dry-run --dart-define=API_BASE_URL=/api
      - name: Verify release stamping of the actual Flutter bundle
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from argparse import Namespace
          from pathlib import Path
          from deploy.release import release_tools

          pubspec = Path("pubspec.yaml")
          source = release_tools.read_flutter_web_source(pubspec)
          web = Path(os.environ["RUNNER_TEMP"]) / "quality-stamped-web"
          shutil.copytree("build/web", web)
          release_tools.stamp_web_release(Namespace(
              pubspec=pubspec, web_root=web, version=source.release_version,
              commit=os.environ["GITHUB_SHA"],
          ))
          print(f"Verified actual Flutter metadata and {source.release_version} release stamping")
          PY

  website:
    name: Website / Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Locked install, lint, typecheck, behavior, migrations, audit and isolated build
        working-directory: website
        run: node scripts/quality-gate.mjs
      - name: Website deployment contracts
        working-directory: website
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'

  deployment:
    name: Deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test updater, backup, setup, monitoring, and cloud policy helpers
        run: |
          python3 -m unittest discover -s deploy/updater -p "test*.py" -v
          python3 -m unittest discover -s deploy/postgres/backup -p "test*.py" -v
          python3 -m unittest discover -s deploy/setup -p "test*.py" -v
          python3 -m unittest discover -s deploy/monitoring -p "test*.py" -v
          python3 -m unittest discover -s deploy/aliyun-oidc -p "test*.py" -v
      - name: Test OCR transport and image limits without downloading models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ocr-tests"
          "$RUNNER_TEMP/ocr-tests/bin/pip" install --quiet -r deploy/ocr/requirements-test.txt
          "$RUNNER_TEMP/ocr-tests/bin/python" -m unittest discover -s deploy/ocr -p 'test_*.py' -v
      - name: Validate deployment templates and script syntax
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoLogo -NoProfile -File deploy/verify-templates.ps1
          mapfile -d '' shell_scripts < <(
            find deploy website/deploy -type f -name '*.sh' -print0 | sort -z
          )
          test "${#shell_scripts[@]}" -gt 0
          for script in "${shell_scripts[@]}"; do
            bash -n "$script"
          done
          python3 -m unittest discover \
            -s deploy/setup \
            -p "test_prepare_existing_test_host_internal_runtime.py" \
            -k SystemdProspectiveContractTest \
            -v
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(
              path
              for root in (Path("deploy"), Path("website/deploy"))
              for path in root.rglob("*.py")
          )
          if not paths:
              raise SystemExit("no deployment Python files found")
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"validated {len(paths)} deployment Python files")
          PY
