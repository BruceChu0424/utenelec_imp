# Uten IMP 内网站点（内部 CA + 自签 TLS）。
# 前端登录需要 WebCrypto，浏览器安全上下文要求必须 HTTPS：
# 首装时按 RUNBOOK 生成内部根 CA 与叶子证书（SAN 含内网域名与服务器 IP），
# 员工电脑运行 deploy/simple/erp-trust-init.bat 导入根 CA 后即为受信任绿锁。
# 证书路径与 6.x 指引一致：/etc/ssl/certs/uten-imp-lan.crt + /etc/ssl/private/uten-imp-lan.key
# SOURCE TEMPLATE ONLY: render the approved DNS name and exact office CIDR;
# never commit a live hostname or private-network address to this file.

limit_req_zone $binary_remote_addr zone=uten_health_ip:10m rate=1000r/s;
limit_req_zone $binary_remote_addr zone=uten_auth_ip:10m rate=300r/s;
limit_req_zone $binary_remote_addr zone=uten_api_ip:20m rate=3000r/m;
limit_req_zone $binary_remote_addr zone=uten_goods_import_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=uten_goods_import_conn:10m;

upstream uten_imp_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 回环静态入口探针（entry-watchdog 使用）
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /opt/uten-imp/current/web;
    access_log off;
    log_not_found off;

    location = /index.html {
        try_files $uri =503;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    location / {
        return 404;
    }
}

# 80 端口：根 CA 下载（安装信任前需可匿名获取）+ 其余一律 301 到 HTTPS
server {
    listen 80;
    server_name __INTERNAL_DOMAIN__ _;
    server_tokens off;

    allow 127.0.0.1;
    allow ::1;
    allow __EXACT_OFFICE_CIDR__;
    deny all;

    location = /ca/uten-imp-root-ca.crt {
        alias /opt/uten-imp/web-extra/uten-imp-root-ca.crt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __INTERNAL_DOMAIN__ _;
    server_tokens off;
    limit_req_status 429;

    ssl_certificate /etc/ssl/certs/uten-imp-lan.crt;
    ssl_certificate_key /etc/ssl/private/uten-imp-lan.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow ::1;
    allow __EXACT_OFFICE_CIDR__;
    deny all;

    root /opt/uten-imp/current/web;
    index index.html;
    client_max_body_size 2m;

    client_header_buffer_size 4k;
    large_client_header_buffers 2 8k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 45s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # style-src 需 'unsafe-inline'：Flutter Web 运行时注入内联样式
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' blob:; img-src 'self' data: blob:; manifest-src 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location = /actuator/health {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location ~ ^/actuator/health/(?:liveness|readiness)$ {
        limit_req zone=uten_health_ip burst=5000 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 5s;
    }

    location /actuator/ {
        return 404;
    }

    location ~ ^/api/(?:auth/(?:login|refresh|logout)|visitor/auth/(?:send-code|login|refresh|logout))$ {
        limit_req zone=uten_auth_ip burst=2000 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # Goods workbooks use raw octet-stream uploads. Keep the 10 MiB exception
    # exact, streamed and isolated from ordinary JSON endpoints.
    location ~ ^/api/master/goods/import/(?:detect|commit)$ {
        client_max_body_size 10m;
        limit_req zone=uten_goods_import_ip burst=4 nodelay;
        limit_conn uten_goods_import_conn 2;
        limit_conn_status 429;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ~ ^/api/attachments/raw/[A-Za-z0-9._-]+$ {
        client_max_body_size 25m;
        limit_req zone=uten_api_ip burst=100 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~ ^/api/.*/export$ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    # 清空业务数据（超管专属测试端点，ADR-067 §7）是同步长请求：排水 ≤45s + 附件自动清理
    # ≤5min + 清库。精确匹配优先于下方 /api/ 前缀与正则 location，仅此路径放宽到 600s
    # （前端 ApiClient.postLongRunning 对该端点的接收超时为 10 分钟，与之对齐）。
    location = /api/system-test/business-data/reset {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        limit_req zone=uten_api_ip burst=500 nodelay;
        proxy_pass http://uten_imp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /ca/uten-imp-root-ca.crt {
        alias /opt/uten-imp/web-extra/uten-imp-root-ca.crt;
    }

    location ^~ /fallback_fonts/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /version.json {
        try_files $uri =503;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
